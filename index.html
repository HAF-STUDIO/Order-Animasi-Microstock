  var h=C.rates.packages.map(function(p){return '<span class="chip '+(!custom&&q===p.qty?"sel":"")+'" data-a="pkg" data-v="'+p.qty+'" role="button" tabindex="0">'+e(p.label)+' · '+p.qty+' video · '+rp(p.price)+'</span>'}).join("");
  h+='<span class="chip '+(custom?"sel":"")+'" data-a="pkg" data-v="custom" role="button" tabindex="0">Lebih dari '+(minCustom()-1)+' video</span>';
  return '<div class="chips">'+h+'</div>'
}
function stepper(list,idx){return '<div class="stp">'+list.map(function(s,i){return '<div class="step '+(i<idx?"done":i===idx?"act":"")+'"><div class="ln"></div><div class="dot">'+(i<idx?"✓":i+1)+'</div><div class="lb">'+s+'</div></div>'}).join("")+'</div>'}
function payPanel(id,pr,upl,perr,label){
  var rem=pr.remaining,dp=dpOf(pr.total,pr.paid),canDp=dp>0&&dp<rem,amt=(S.pm==="dp"&&canDp)?dp:rem;
  return '<div class="pay"><div class="pt">1. Transfer ke rekening</div>'+
   '<div class="br"><span>Bank</span><b>'+e(C.bank.name)+'</b></div><div class="br"><span>No. Rekening</span><b>'+e(C.bank.no)+'</b></div><div class="br"><span>Atas Nama</span><b>'+e(C.bank.holder)+'</b></div>'+
   (pr.discount?'<div class="br"><span>Diskon'+(pr.promoCode?" ("+e(pr.promoCode)+")":"")+'</span><b>- '+rp(pr.discount)+'</b></div>':"")+
   '<div class="br"><span>Total tagihan</span><b>'+rp(pr.total)+'</b></div>'+(pr.paid>0?'<div class="br"><span>Sudah dibayar</span><b>'+rp(pr.paid)+'</b></div>':"")+'</div>'+
   (canDp?'<div class="f"><label>Mau bayar berapa?</label><div class="chips"><span class="chip '+(S.pm!=="dp"?"sel":"")+'" data-a="paymode" data-v="lunas" role="button" tabindex="0">Lunas · '+rp(rem)+'</span><span class="chip '+(S.pm==="dp"?"sel":"")+'" data-a="paymode" data-v="dp" role="button" tabindex="0">DP '+C.dpPct+'% · '+rp(dp)+'</span></div><div class="note">Dengan DP, pengerjaan langsung dimulai. Sisanya dibayar sebelum file dikirim.</div></div>':"")+
   '<div class="note" style="text-align:center;margin:0">Nominal yang ditransfer</div><div class="amt">'+rp(amt)+'</div>'+
   '<div class="row2" style="margin-bottom:22px"><button class="btn b2 sm" data-a="copy" data-v="'+e(C.bank.no)+'">Salin No. Rekening</button><button class="btn b2 sm" data-a="copy" data-v="'+Math.round(amt)+'">Salin Nominal</button></div>'+
   '<div class="bt">2. Unggah bukti transfer</div>'+
   '<div class="f"><input type="file" id="pf" accept="image/*" '+(upl?"disabled":"")+'><div class="note">Foto atau screenshot bukti. Ukuran otomatis diperkecil.</div></div>'+
   (perr?'<div class="msg err">'+e(perr)+'</div>':"")+
   '<button class="btn b1" data-a="proof" data-id="'+e(id)+'" '+(upl?"disabled":"")+'>'+(upl?"Mengunggah...":(label||"Saya Sudah Bayar"))+'</button>'
}

/* render */
function render(){
  var h='<header><div class="row"><div><h1>'+e(C.name)+'</h1><p>Pesan, bayar, dan pantau animasi Anda di satu tempat</p></div><div class="pill"><i></i>Sistem Online</div></div></header>'+
   '<nav>'+[["order","Buat Pesanan"],["status","Lacak Pesanan"]].map(function(t){return '<button data-a="tab" data-v="'+t[0]+'" class="'+(S.tab===t[0]?"on":"")+'">'+t[1]+'</button>'}).join("")+'</nav>'+
   '<main>'+(S.tab==="order"?tabOrder():tabStatus())+'</main><footer>Data pesanan tersimpan privat. Simpan kode pesanan Anda.</footer>';
  document.getElementById("app").innerHTML=h;ticker()
}

/* klaim garansi: pilih banyak file sekaligus */
function claimedKeys(){var m={};((S.res&&S.res.claims)||[]).forEach(function(c){m[String(c.fileName).toLowerCase()+"|"+String(c.platform).toLowerCase()]=c.status});return m}

function claimCards(list){
  if(!list||!list.length)return"";
  var act=list.filter(function(c){return c.status==="Dikerjakan"}),done=list.filter(function(c){return c.status==="Selesai"}).length,
      wait=list.some(function(c){return c.status==="Menunggu"}),last=null;
  act.forEach(function(c){if(c.estimasiSelesai&&(!last||c.estimasiSelesai>last))last=c.estimasiSelesai});
  var h='<div class="card cc"><div class="bt">Riwayat klaim ('+list.length+' file)</div>';
  if(act.length)h+=etaLock(last,act.length+" file klaim sedang dikerjakan.","cl","Target ini batas akhir semua file; sebagian bisa selesai lebih cepat.");
  if(wait)h+='<div class="ok">Sebagian klaim menunggu peninjauan admin.</div>';
  if(done)h+='<div class="ok">'+done+' file selesai direvisi. Cek folder hasil dan unggah ulang hanya ke platform yang menolak.</div>';
  return h+list.map(function(c){
    return '<div class="cr"><span class="cn">'+e(c.fileName)+'</span><span class="cb '+e(c.status)+'">'+e(c.status)+'</span><span class="tag">'+e(c.claimType||"Teknis")+(c.platform?" · "+e(c.platform):"")+'</span>'+
      (c.status==="Ditolak"&&c.alasan?'<div class="note" style="width:100%">Catatan admin: '+e(c.alasan)+'</div>':"")+'</div>'
  }).join("")+'</div>'
}

function claimForm(p){
  var c=S.cl,w=p.warranty||{};if(!c.open)return"";
  if(c.done){var d=c.done,auto=d.status==="Dikerjakan";
    return '<div class="card"><div class="bt">Klaim terkirim ✅</div><div class="ok"><b>'+(d.count||1)+' file</b> berhasil diklaim. '+(auto?"Klaim disetujui otomatis dan sudah masuk antrean revisi. Target selesai tampil di Riwayat klaim.":"Status <b>Menunggu</b>, admin akan meninjau.")+(d.skipped?" ("+d.skipped+" file dilewati karena sudah pernah diklaim.)":"")+'</div><div class="row2"><button class="btn b2 sm" data-a="claim-more">Klaim file lain</button><button class="btn b2 sm" data-a="claim-close">Tutup</button></div></div>'}
  var files=w.deliveredFiles||[],cn=!!CONCEPT[c.type],ck=claimedKeys(),pl=(c.plat||"").toLowerCase();
  var isDone=function(x){return !!(c.plat&&ck[x.toLowerCase()+"|"+pl])};
  var avail=files.filter(function(x){return !isDone(x)}),allOn=avail.length>0&&avail.every(function(x){return c.files.indexOf(x)>-1});
  var fileUi=files.length?
    '<div class="flh"><span>'+c.files.length+' file dipilih</span><button type="button" class="btn b2 sm" data-a="call">'+(allOn?"Hapus pilihan":"Pilih semua")+'</button></div><div class="fl">'+
      files.map(function(x){var dn=isDone(x);return '<label class="fi '+(dn?"dis":"")+'"><input type="checkbox" data-a="cfile" data-v="'+e(x)+'" '+(c.files.indexOf(x)>-1&&!dn?"checked":"")+(dn?" disabled":"")+'><span>'+e(x)+(dn?" · sudah diklaim":"")+'</span></label>'}).join("")+'</div>'+(c.plat?"":'<div class="note">Pilih platform dulu agar file yang sudah diklaim ditandai.</div>'):
    '<textarea id="c-file" placeholder="Satu nama file per baris, mis.&#10;anim_01.mp4&#10;anim_02.mp4">'+e(c.file)+'</textarea><div class="note">Boleh banyak file, pisahkan dengan baris baru atau koma.</div>';
  return (c.err?'<div class="msg err">'+e(c.err)+'</div>':"")+'<div class="card" id="claim-card"><div class="bt">Ajukan Klaim Garansi</div>'+
   '<details class="rules"><summary>Syarat &amp; Ketentuan Garansi</summary><ol>'+tnc().map(function(t){return "<li>"+t+"</li>"}).join("")+'</ol></details>'+
   '<div class="rules" style="padding:0 20px"><div class="quota"><span>Sisa kuota klaim</span><span>'+(w.remaining!=null?w.remaining+" dari "+w.maxClaims+" file":"-")+'</span></div></div>'+
   '<div class="f"><label>Alasan penolakan</label><select id="c-type">'+TYPES.map(function(t){return '<option value="'+t.k+'" '+(c.type===t.k?"selected":"")+'>'+e(t.t)+'</option>'}).join("")+'</select>'+(cn?'<div class="note">Akan dikerjakan sebagai video pengganti dengan konsep baru.</div>':"")+'</div>'+
   '<div class="f"><label>Platform yang menolak</label><select id="c-plat"><option value="">Pilih platform</option>'+(p.platforms&&p.platforms.length?p.platforms:PLATS).map(function(x){return '<option '+(c.plat===x?"selected":"")+'>'+e(x)+'</option>'}).join("")+'</select></div>'+
   '<div class="f"><label>File yang ditolak</label>'+fileUi+'</div>'+
   '<div class="f"><label>Teks penolakan dari platform</label><input type="text" id="c-reason" value="'+e(c.reason)+'" placeholder="Misal: Artifacts detected" autocomplete="off"><div class="note">Salin persis dari platform yang menolak. Satu alasan untuk semua file yang dipilih.</div></div>'+
   '<div class="f"><label>Screenshot bukti penolakan</label><input type="file" id="c-shot" accept="image/*" '+(c.busy?"disabled":"")+'>'+(c.fobj?'<div class="picked">Dipilih: '+e(c.fobj.name)+'</div>':"")+'<div class="note">Satu screenshot cukup untuk semua file, asalkan memuat nama file, alasan, dan tanggal.</div></div>'+
   '<label class="agree"><input type="checkbox" id="c-agree" '+(c.agree?"checked":"")+'><span>Saya sudah membaca dan menyetujui Syarat &amp; Ketentuan garansi.</span></label>'+
   '<button class="btn b1" data-a="claim-send" '+(c.busy?"disabled":"")+'>'+(c.busy?"Mengirim...":"Kirim Klaim"+(c.files.length>1?" ("+c.files.length+" file)":""))+'</button> <button class="btn b2 sm" data-a="claim-close" style="margin-top:10px" '+(c.busy?"disabled":"")+'>Batal</button></div>'
}

/* kartu "langkah Anda sekarang" — satu aksi jelas di tiap tahap */
function nextCard(p){
  var px=p.price,st=p.status,h="";
  if(st==="Menunggu Bayar")
    h='<div class="card next"><div class="bt">👉 Langkah Anda: bayar &amp; unggah bukti</div>'+payPanel(p.id,px,S.upl,S.perr)+'</div>';
  else if(st==="Verifikasi")
    h='<div class="card next"><div class="bt">⏳ Bukti sedang dicek admin</div>'+(p.lapor>0?'<div class="ok">Anda melaporkan transfer '+rp(p.lapor)+'. Mohon tunggu konfirmasi.</div>':'<div class="ok">Bukti Anda sudah diterima.</div>')+'<div class="eta pend">Setelah pembayaran dikonfirmasi, jadwal pengerjaan terkunci dan tanggal target muncul di sini.</div>'+
      (px.remaining>0&&!p.lapor?'<div class="bt" style="margin-top:12px">Belum membayar? Kirim bukti</div>'+payPanel(p.id,px,S.upl,S.perr):'')+'</div>';
  else if(st==="Dikerjakan"){
    h='<div class="card next"><div class="bt">🎬 Animasi Anda sedang digarap</div>'+etaLock(p.estimasiSelesai,"Pesanan Anda sedang dikerjakan.","",p.queueAheadHours>0?"Antrean sebelum pesanan ini: "+Number(p.queueAheadHours).toLocaleString("id-ID",{maximumFractionDigits:1})+" jam kerja.":"");
    if(px.remaining>0)h+='<div class="msg warn">Sisa tagihan <b>'+rp(px.remaining)+'</b> perlu dilunasi sebelum file dikirim. Anda bisa melunasinya kapan saja.</div>'+payPanel(p.id,px,S.upl,S.perr,"Kirim Bukti Pelunasan");
    else h+='<div class="ok">Pembayaran lunas ✅ Anda tinggal menunggu hasilnya.</div>';
    h+='</div>'
  }else if(st==="Selesai"){
    h='<div class="card next"><div class="bt">🎉 Pesanan selesai</div>';
    if(px.remaining>0)h+='<div class="msg warn">Lunasi sisa <b>'+rp(px.remaining)+'</b> untuk membuka file hasil.</div>'+payPanel(p.id,px,S.upl,S.perr,"Kirim Bukti Pelunasan");
    else h+='<div class="ok">Semua beres! File hasil siap diunduh.</div>';
    h+='</div>'
  }
  if(p.previewLink&&st==="Selesai"&&!p.driveLink)h+='<div class="drive"><div style="flex:1"><label>Pratinjau hasil</label><div style="font-size:13.5px;color:#0E7C71">Cuplikan video (resolusi penuh terbuka setelah lunas).</div></div><a class="btn bd" href="'+e(p.previewLink)+'" target="_blank" rel="noopener">Lihat Pratinjau</a></div>';
  if(p.driveLink&&(st==="Dikerjakan"||st==="Selesai"))h+='<div class="drive"><div style="flex:1"><label>File hasil animasi</label><div style="font-size:13.5px;color:#0E7C71">Folder Drive pesanan ini siap dibuka.</div></div><a class="btn bd" href="'+e(p.driveLink)+'" target="_blank" rel="noopener">Buka Folder</a></div>';
  return h
}

function tabStatus(){
  var box='<div class="card"><div class="f" style="margin:0"><label>Kode Pesanan</label><div style="display:flex;gap:10px"><input type="text" id="s-id" value="'+e(S.lid)+'" placeholder="PRJ-XXXXXXXX" style="flex:1" autocapitalize="characters" autocomplete="off"><button class="btn b1 sm" data-a="lookup" '+(S.loading?"disabled":"")+'>'+(S.loading?"Memuat...":"Lacak")+'</button></div></div></div>';
  var r=S.err?'<div class="msg '+(S.loading?"info":"err")+'">'+e(S.err)+'</div>':"";
  if(S.res){
    var p=S.res,ix=STEPS.indexOf(p.status),px=p.price,w=p.warranty||{};
    r+='<div class="card">'+stepper(["Bayar","Verifikasi","Dikerjakan","Selesai"],Math.max(ix,0))+'<div class="dg"><div><label>Pemesan</label><div class="dv">'+e(p.clientName)+'</div></div><div><label>Platform</label><div class="dv">'+(p.platforms&&p.platforms.length?e(p.platforms.join(", ")):"-")+'</div></div><div><label>Jumlah video</label><div class="dv">'+p.qty+' video</div></div><div><label>Status pembayaran</label><div class="dv">'+(px.remaining===0&&px.total>0?'<span style="color:var(--teal)">LUNAS</span>':px.paid>0?'<span style="color:var(--ambink)">DP '+Math.round(px.paid/px.total*100)+'% · sisa '+rp(px.remaining)+'</span>':'<span style="color:var(--acc2)">BELUM BAYAR</span>')+'</div></div></div></div>';
    r+=nextCard(p);
    if(p.status==="Selesai"||(p.claims&&p.claims.length)){
      var wb="";
      if(w.eligible)wb='<div class="row2" style="margin-bottom:18px"><button class="btn b2" data-a="claim-toggle">'+(S.cl.open?"Tutup form klaim":"🛡️ Ajukan Klaim Garansi")+'</button></div>'+(w.windowEndsAt?'<div class="note" style="text-align:center;margin:-8px 0 18px">Masa klaim sampai '+e(new Date(w.windowEndsAt).toLocaleDateString("id-ID",{timeZone:"Asia/Jakarta",day:"numeric",month:"long",year:"numeric"}))+'</div>':"");
      else if(p.status==="Selesai"){
        var rt={not_paid:"Garansi aktif setelah pesanan lunas.",window_expired:"Masa klaim garansi sudah berakhir.",quota_exhausted:"Semua file pesanan ini sudah pernah diklaim.",too_many_pending:"Masih ada klaim menunggu peninjauan admin."}[w.reason];
        if(rt)wb='<div class="msg warn">'+e(rt)+'</div>'
      }
      r+=wb+claimForm(p)+claimCards(p.claims)
    }
  }
  return '<h2>Lacak Pesanan</h2><p class="sub">Lihat progres dan langkah Anda berikutnya.</p>'+box+r
}

/* aksi */
function lookup(silent){
  var el=document.getElementById("s-id"),id=(el?el.value:S.lid).trim().toUpperCase();S.lid=id;var rid=++S.rid;
  if(!id){S.loading=false;S.err="Masukkan kode pesanan.";S.res=null;render();return}
  if(!silent){S.loading=true;S.err="Memuat status...";S.perr="";if(!S.res||String(S.res.id).toUpperCase()!==id)S.res=null;render()}
  getq({id:id}).then(function(d){
    if(rid!==S.rid)return;S.loading=false;
    if(d&&d.error){if(!silent){S.err="Kode tidak ditemukan. Periksa kembali.";S.res=null;render()}return}
    if(!d||!d.id){if(!silent){S.err="Data tidak lengkap.";S.res=null;render()}return}
    var changed=!S.res||JSON.stringify(d)!==JSON.stringify(S.res);
    S.err="";S.res=d;ls(LSK,d.id);if(S.cl.id!==d.id){S.cl=newClaim();S.cl.id=d.id}
    if(!silent||changed)render()
  }).catch(function(x){if(rid!==S.rid)return;S.loading=false;if(!silent){S.err=x&&x.timeout?"Server lambat. Coba lagi.":"Gagal memuat. Coba lagi.";render()}})
}
function pickFile(id){var i=document.getElementById(id);return i&&i.files&&i.files[0]}
function doProof(id,isNew){
  var f=pickFile("pf"),t=isNew?S.om:S;
  if(!f){t.perr="Pilih foto bukti transfer dulu.";render();return}
  t.perr="";t.upl=true;render();
  shrink(f).then(function(g){
    if(g.size>C.maxProof){throw new Error("big")}
    return b64(g).then(function(d){return post({action:"upload_proof",id:id,mode:S.pm,fileName:g.name,mimeType:g.type||"image/jpeg",fileData:d})})
  }).then(function(d){
    t.upl=false;
    if(d&&d.success){if(isNew){S.om.phase="sent";ls(LSK,id);render();window.scrollTo(0,0)}else{lookup()}}
    else{t.perr="Gagal mengunggah: "+(({sudah_lunas:"pesanan ini sudah lunas",file_terlalu_besar:"file terlalu besar"})[d&&d.error]||(d&&d.error)||"coba lagi");render()}
  }).catch(function(x){t.upl=false;t.perr=x&&x.message==="big"?"Foto masih lebih dari 4MB. Coba screenshot ulang.":"Koneksi gagal. Coba lagi.";render()})
}
function submitOrder(){
  var f=S.form;f.err="";
  if(!f.name.trim()||f.phone.replace(/\D/g,"").length<9){f.err="Isi nama dan nomor WhatsApp yang valid.";render();window.scrollTo(0,0);return}
  if(!f.plats.length){f.err="Pilih minimal 1 platform.";render();window.scrollTo(0,0);return}
  if(f.custom&&(!f.qty||f.qty<minCustom())){f.err="Minimal "+minCustom()+" video untuk pesanan besar.";render();window.scrollTo(0,0);return}
  if(!f.pid)f.pid=uid();var id=f.pid,pr=price(f.qty);f.busy=true;render();
  post({action:"create",id:id,clientName:f.name.trim(),clientPhone:f.phone.trim(),platforms:f.plats.slice(),qty:f.qty,promoCode:(f.code||"").trim()}).then(function(d){
    f.busy=false;
    if(d&&d.success){var q=d.project||{};S.pm="lunas";S.om={id:id,phase:"pay",perr:"",upl:false,p:{total:typeof q.total==="number"?q.total:pr.total,discount:q.discount||0,promoCode:q.promoCode||"",isRepeat:!!q.isRepeat}};f.pid=null;S.lid=id;ls(LSK,id);render();window.scrollTo(0,0)}
    else{f.err=(d&&(d.message||d.error))||"Gagal membuat pesanan. Coba lagi.";render();window.scrollTo(0,0)}
  }).catch(function(){f.busy=false;f.err="Koneksi gagal. Pesanan belum dibuat, silakan coba lagi.";render();window.scrollTo(0,0)})
}
function applyPromo(){
  var f=S.form,code=(f.code||"").trim().toUpperCase();
  if(!code){f.promo=null;f.pmsg="Isi kode promo dulu.";render();return}
  f.pload=true;f.pmsg=null;render();
  getq({action:"promo",code:code,qty:f.qty}).then(function(d){f.pload=false;if(d&&d.valid){f.promo={code:d.code,discount:d.discount};f.code=d.code;f.pmsg=d.message}else{f.promo=null;f.pmsg=(d&&d.message)||"Kode tidak valid."}render()}).catch(function(){f.pload=false;f.promo=null;f.pmsg="Gagal cek promo.";render()})
}
function sendClaim(){
  var c=S.cl,p=S.res,shot=pickFile("c-shot")||c.fobj;c.fobj=shot||null;if(!p)return;
  var w=p.warranty||{},hasList=w.deliveredFiles&&w.deliveredFiles.length,seen={},files=[];
  (hasList?c.files:String(c.file||"").split(/[\n,;]+/)).forEach(function(x){x=String(x).trim();if(x&&!seen[x.toLowerCase()]){seen[x.toLowerCase()]=1;files.push(x)}});
  if(!c.plat){c.err="Pilih platform yang menolak.";render();return}
  if(!files.length){c.err="Pilih minimal 1 file.";render();return}
  if(!c.reason.trim()){c.err="Isi teks penolakan dari platform.";render();return}
  if(!shot){c.err="Unggah screenshot penolakan.";render();return}
  if(!c.agree){c.err="Centang persetujuan Syarat & Ketentuan.";render();return}
  c.err="";c.busy=true;render();
  shrink(shot).then(function(g){
    if(g.size>C.maxProof)throw new Error("big");
    return b64(g).then(function(d){return post({action:"warranty_claim",id:p.id,rejectedFiles:files,reason:c.reason.trim(),claimType:c.type,platform:c.plat,agreed:true,proofFileName:g.name,mimeType:g.type||"image/jpeg",fileData:d})})
  }).then(function(d){
    c.busy=false;
    if(d&&d.success){c.done=d.claim||{count:files.length};c.fobj=null;c.files=[];c.file="";getq({id:p.id}).then(function(x){if(x&&x.id)S.res=x;render();window.scrollTo(0,0)}).catch(function(){render()})}
    else{c.err=(d&&(d.message||d.error))||"Klaim gagal.";render()}
  }).catch(function(x){c.busy=false;c.err=x&&x.message==="big"?"Screenshot masih lebih dari 4MB.":"Koneksi terputus. Lacak ulang dulu sebelum mencoba lagi agar klaim tidak dobel.";render()})
}
function toggle(a,v){var i=a.indexOf(v);if(i>-1)a.splice(i,1);else a.push(v)}
/* render ulang tanpa menggeser posisi gulir daftar file */
function keepList(fn){var fl=document.querySelector(".fl"),st=fl?fl.scrollTop:0;fn();render();fl=document.querySelector(".fl");if(fl)fl.scrollTop=st}

document.addEventListener("click",function(ev){
  var t=ev.target.closest("[data-a]");if(!t)return;var a=t.getAttribute("data-a"),v=t.getAttribute("data-v"),id=t.getAttribute("data-id");
  if(t.tagName==="A"&&!t.getAttribute("href")||t.getAttribute("href")==="#")ev.preventDefault();
  switch(a){
    case"tab":S.tab=v;S.err="";if(v==="status"&&S.lid&&!S.res)lookup();else render();break;
    case"plat":toggle(S.form.plats,v);render();break;
    case"pkg":if(v==="custom"){S.form.custom=true;S.form.qty=Math.max(50,minCustom())}else{S.form.custom=false;S.form.qty=Number(v)}S.form.promo=null;S.form.pmsg=null;render();break;
    case"promo":applyPromo();break;
    case"submit":submitOrder();break;
    case"paymode":S.pm=v;render();break;
    case"proof":doProof(id,t.closest("main")&&S.tab==="order"&&S.om&&S.om.id===id);break;
    case"newo":S.form=newForm();S.om=null;S.pm="lunas";render();break;
    case"copy":if(navigator.clipboard)navigator.clipboard.writeText(v||id).catch(function(){});var o=t.innerText;t.innerText="Tersalin!";setTimeout(function(){t.innerText=o},1600);break;
    case"goto":S.lid=id;S.tab="status";S.res=null;S.err="";S.pm="lunas";render();lookup();window.scrollTo(0,0);break;
    case"lookup":lookup();break;
    case"claim-toggle":var op=!S.cl.open;if(op){var keep=S.cl.id;S.cl=newClaim();S.cl.id=keep}S.cl.open=op;render();if(op){var cc=document.getElementById("claim-card");if(cc)cc.scrollIntoView({behavior:"smooth",block:"start"})}break;
    case"claim-more":var k=S.cl.id;S.cl=newClaim();S.cl.id=k;S.cl.open=true;render();break;
    case"claim-close":S.cl.open=false;S.cl.done=null;render();break;
    case"claim-send":sendClaim();break;
    case"cfile":keepList(function(){toggle(S.cl.files,v)});break;
    case"call":keepList(function(){var ck2=claimedKeys(),pl2=(S.cl.plat||"").toLowerCase(),av=((S.res.warranty||{}).deliveredFiles||[]).filter(function(x){return !(S.cl.plat&&ck2[x.toLowerCase()+"|"+pl2])});S.cl.files=av.every(function(x){return S.cl.files.indexOf(x)>-1})?[]:av});break;
  }
});
document.addEventListener("keydown",function(ev){
  if((ev.key==="Enter"||ev.key===" ")&&ev.target.classList&&ev.target.classList.contains("chip")){ev.preventDefault();ev.target.click()}
  else if(ev.key==="Enter"&&ev.target.id==="s-id"){ev.preventDefault();lookup()}
});
document.addEventListener("input",function(ev){
  var el=ev.target,i=el.id,v=el.value;
  if(i==="f-name")S.form.name=v;else if(i==="f-phone")S.form.phone=v;
  else if(i==="s-id")S.lid=v.toUpperCase();
  else if(i==="c-reason")S.cl.reason=v;
  else if(i==="c-file")S.cl.file=v;
  else if(i==="f-promo"){var f=S.form;f.code=v;if(f.promo||f.pmsg){f.promo=null;f.pmsg=null;render();var n=document.getElementById("f-promo");if(n){n.focus();try{n.setSelectionRange(n.value.length,n.value.length)}catch(x){}}}}
});
document.addEventListener("change",function(ev){
  var el=ev.target,i=el.id,v=el.value;
  if(i==="f-qty"){S.form.qty=Math.max(Math.round(Number(v)||0),minCustom());S.form.promo=null;S.form.pmsg=null;render()}
  else if(i==="c-type"){S.cl.type=v;render()}
  else if(i==="c-plat"){S.cl.plat=v;S.cl.files=[];render()}
  else if(i==="c-file")S.cl.file=v;
  else if(i==="c-shot")S.cl.fobj=(el.files&&el.files[0])||null;
  else if(i==="c-agree")S.cl.agree=el.checked;
});

/* penyegaran otomatis status (tanpa mengganggu pengisian form) */
setInterval(function(){
  var ae=document.activeElement,typing=ae&&/^(INPUT|TEXTAREA|SELECT)$/.test(ae.tagName);
  if(S.tab!=="status"||!S.res||S.res.status==="Selesai"&&!(S.res.claims||[]).some(function(c){return c.status==="Menunggu"||c.status==="Dikerjakan"})||S.upl||S.loading||S.cl.open||S.cl.busy||typing||document.hidden)return;
  lookup(true)
},45000);

/* mulai: ?id=KODE atau kode terakhir di perangkat ini langsung dibuka */
var qid=(new URLSearchParams(location.search).get("id")||"").trim().toUpperCase();
if(qid){S.lid=qid;S.tab="status"}
render();
if(S.tab==="status")lookup();
fj(C.url+"?action=config",{},1,8000).then(function(d){
  if(!d)return;
  if(d.rates&&d.rates.packages)C.rates={packages:d.rates.packages,over:d.rates.over||d.rates.overflowPricePerVideo||C.rates.over};
  if(d.production)C.prod={vpd:d.production.videosPerDay,start:d.production.workWindowStartHour,end:d.production.workWindowEndHour,buffer:d.production.setupBufferHours};
  if(d.platforms&&d.platforms.length)PLATS=d.platforms;
  if(d.dpPct)C.dpPct=d.dpPct;
  if(d.warranty)C.war={days:d.warranty.days||C.war.days,pct:d.warranty.pct||C.war.pct,auto:d.warranty.auto!==false,maxBatch:d.warranty.maxBatch||50};
  C.queueHours=Number(d.queueHours)||0;
  var ae=document.activeElement;if(!(ae&&/^(INPUT|TEXTAREA|SELECT)$/.test(ae.tagName)))render()
}).catch(function(){});
})();
</script>
