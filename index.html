<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
<title>Order Animasi Microstock</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --navy:#12162B; --paper:#F4F5F9; --panel:#FFFFFF; --panel-alt:#EDEFF6;
    --border:#E1E4EE; --border-strong:#C7CCDE;
    --ink:#12131A; --ink-soft:#4A4D5E; --ink-faint:#868AA0;
    --accent:#FFA733; --accent-strong:#E88F12; --accent-ink:#17181F;
    --teal:#0E9C90; --teal-bg:#E7F7F5; --teal-border:#B7E7E1;
    --coral:#E8503D; --coral-bg:#FDEEEC; --coral-border:#F5C2BA;
    --blue-bg:#EAF0FF; --blue-border:#C7D6FA; --blue-ink:#1E3A8A;
    --purple-bg:#F1EEFF; --purple-border:#D9CFFB; --purple-ink:#4C2E9C;
    --amber-bg:#FFF4D6; --amber-ink:#7A5A00;
    --r-lg:18px; --r-md:12px; --r-sm:8px;
    --f-d:'Space Grotesk',sans-serif; --f-b:'Inter',sans-serif;
    --sh:0 1px 2px rgba(18,22,43,0.04),0 8px 24px -12px rgba(18,22,43,0.12);
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{background:var(--paper);color:var(--ink);font-family:var(--f-b);font-size:15.5px;line-height:1.6;-webkit-font-smoothing:antialiased}
  #app{max-width:720px;margin:0 auto}
  a{color:inherit}
  :focus-visible{outline:2px solid var(--accent-strong);outline-offset:2px;border-radius:4px}
  .top-stripe{height:5px;background:repeating-linear-gradient(115deg,var(--accent) 0 16px,var(--navy) 16px 32px)}

  header.top{background:var(--navy);color:#fff;padding:26px 20px 24px;border-radius:0 0 22px 22px;box-shadow:0 12px 28px -18px rgba(18,22,43,.55);max-width:720px;margin:0 auto}
  header.top .top-row{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;flex-wrap:wrap}
  header.top .brand-name{font-family:var(--f-d);font-weight:700;font-size:24px;margin:0 0 6px 0;color:#fff}
  header.top .tagline{color:#A9AEC7;font-size:14px;margin:0}
  header.top .frame-mark{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;font-weight:600;color:#E7E9F5;border:1px solid rgba(255,255,255,.16);background:rgba(255,255,255,.06);border-radius:999px;padding:7px 14px 7px 11px;white-space:nowrap}
  header.top .frame-mark .dot{width:7px;height:7px;border-radius:50%;background:var(--accent);flex:none}

  nav.tabs{display:flex;gap:8px;margin:18px auto 28px;padding:16px 20px 0;overflow-x:auto;scrollbar-width:none;max-width:720px}
  nav.tabs::-webkit-scrollbar{display:none}
  nav.tabs button{background:var(--panel);border:1px solid var(--border);color:var(--ink-soft);font-family:var(--f-b);font-size:14.5px;font-weight:600;padding:11px 18px;border-radius:999px;cursor:pointer;white-space:nowrap;transition:.15s;flex:none}
  nav.tabs button:hover{border-color:var(--border-strong);color:var(--ink)}
  nav.tabs button.active{color:var(--accent-ink);border-color:var(--accent);background:var(--accent);box-shadow:0 4px 10px -4px rgba(232,143,18,.55)}

  main{max-width:720px;margin:0 auto;padding:0 20px}
  h2.panel-title{font-family:var(--f-d);font-size:22px;font-weight:700;margin:0 0 6px 0}
  p.panel-sub{color:var(--ink-soft);font-size:14.5px;margin:0 0 20px 0}

  .card{background:var(--panel);border:1px solid var(--border);border-radius:var(--r-lg);padding:24px;margin-bottom:18px;box-shadow:var(--sh)}
  .box-title{font-weight:700;color:var(--ink);margin-bottom:12px;font-size:16px}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:18px}
  @media(max-width:620px){.grid2{grid-template-columns:1fr;gap:4px}}

  label{display:block;font-size:13px;color:var(--ink-soft);margin-bottom:7px;font-weight:600}
  .field{margin-bottom:18px}
  input[type=text],input[type=number],input[type=tel],textarea{width:100%;background:var(--panel-alt);border:1px solid var(--border);color:var(--ink);border-radius:var(--r-sm);padding:13px 14px;font-family:var(--f-b);font-size:16px;min-height:48px;transition:.15s}
  textarea{resize:vertical;min-height:92px}
  input:focus,textarea:focus{outline:none;background:var(--panel);border-color:var(--accent-strong);box-shadow:0 0 0 4px rgba(255,167,51,.18)}
  input::placeholder{color:var(--ink-faint)}
  input[type=file]{width:100%;background:var(--panel-alt);border:1px dashed var(--border-strong);color:var(--ink-soft);border-radius:var(--r-sm);padding:12px 14px;font-family:var(--f-b);font-size:14px;min-height:48px}
  .field-note{font-size:12.5px;color:var(--ink-faint);margin-top:6px}
  button.btn:disabled{opacity:.6;cursor:not-allowed;transform:none!important}

  .chip-group{display:flex;flex-wrap:wrap;gap:9px}
  .chip{border:1px solid var(--border);background:var(--panel);border-radius:999px;padding:10px 16px;font-size:14px;cursor:pointer;color:var(--ink-soft);user-select:none;font-weight:500;transition:.15s;min-height:40px;display:inline-flex;align-items:center}
  .chip:hover{border-color:var(--border-strong)}
  .chip.selected{background:var(--navy);color:#fff;border-color:var(--navy);font-weight:600}

  button.btn{font-family:var(--f-b);font-weight:700;font-size:15.5px;border-radius:var(--r-sm);padding:14px 24px;cursor:pointer;border:1px solid transparent;transition:.15s;display:inline-flex;align-items:center;justify-content:center;min-height:50px}
  button.btn-primary{background:var(--accent);color:var(--accent-ink);box-shadow:0 4px 12px -4px rgba(232,143,18,.5);width:100%}
  button.btn-primary:hover{background:var(--accent-strong);transform:translateY(-1px)}
  button.btn-ghost{background:transparent;color:var(--ink-soft);border-color:var(--border-strong);width:auto}
  button.btn-ghost:hover{background:var(--panel-alt);color:var(--ink)}
  button.btn-small{padding:10px 18px;font-size:14px;width:auto;min-height:42px}

  .msg{padding:14px 18px;border-radius:var(--r-sm);font-size:14.5px;margin-bottom:18px;font-weight:500}
  .msg-error{background:var(--coral-bg);border:1px solid var(--coral-border);color:#9C2A1D}
  .msg-info{background:var(--blue-bg);border:1px solid var(--blue-border);color:var(--blue-ink)}
  .msg-warn{background:var(--amber-bg);border:1px solid #FFE0A3;color:var(--amber-ink)}

  .estimate-box{background:var(--panel-alt);border:1px solid var(--border);border-left:3px solid var(--accent);border-radius:var(--r-md);padding:20px 22px}
  .estimate-row{display:flex;justify-content:space-between;gap:12px;font-size:14.5px;padding:6px 0;color:var(--ink-soft)}
  .estimate-row.total{color:var(--ink);font-weight:700;font-size:18px;border-top:1px solid var(--border-strong);margin-top:10px;padding-top:14px}
  .estimate-row.discount{color:var(--teal);font-weight:600}
  .estimate-row.paid{color:var(--teal);font-weight:700}
  .estimate-row.remaining{color:var(--amber-ink);font-weight:700}

  .id-display{font-family:var(--f-d);font-size:28px;font-weight:700;letter-spacing:.04em;background:var(--panel-alt);border:2px dashed var(--border-strong);color:var(--navy);padding:20px;border-radius:var(--r-md);text-align:center;margin:4px 0 20px;word-break:break-all}

  .stepper{display:flex;margin:30px 0 22px;position:relative}
  .step{flex:1;text-align:center;position:relative;min-width:0;padding:0 2px}
  .step .dot{width:32px;height:32px;border-radius:50%;background:var(--panel);border:2px solid var(--border-strong);display:flex;align-items:center;justify-content:center;margin:0 auto 10px;font-size:13px;font-weight:700;color:var(--ink-faint);position:relative;z-index:2;transition:.3s}
  .step .line{position:absolute;top:15px;left:-50%;width:100%;height:3px;background:var(--border-strong);z-index:1}
  .step:first-child .line{display:none}
  .step.done .dot{background:var(--navy);border-color:var(--navy);color:#fff}
  .step.done .line{background:var(--navy)}
  .step.active .line{background:var(--navy)}
  .step.active .dot{background:var(--teal);border-color:var(--teal);color:#fff;box-shadow:0 0 0 5px var(--teal-bg)}
  .step .label{font-size:11.5px;color:var(--ink-faint);font-weight:500;line-height:1.3}
  .step.active .label{color:var(--teal);font-weight:700}
  .step.done .label{color:var(--ink);font-weight:600}
  @media(max-width:480px){.step .label{font-size:10px}.step .dot{width:26px;height:26px;font-size:11.5px}.step .line{top:12px}}

  .cancelled-banner{background:var(--coral-bg);border:1px solid var(--coral-border);color:#9C2A1D;padding:14px 18px;border-radius:var(--r-md);font-size:15px;margin:4px 0 20px;font-weight:600}
  .drive-box{margin-top:22px;padding:18px 20px;background:var(--teal-bg);border:1px solid var(--teal-border);border-radius:var(--r-md);display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:14px}
  .drive-box label{color:#0B6B62;margin-bottom:4px}
  .drive-box .drive-note{font-size:13.5px;color:#0E7C71;font-weight:500}
  .btn-drive{background:var(--teal);color:#fff;border-color:var(--teal);box-shadow:0 4px 12px -4px rgba(14,156,144,.5);width:auto;text-decoration:none}

  .pay-box{margin-top:4px;padding:20px 22px;background:var(--blue-bg);border:1px solid var(--blue-border);border-radius:var(--r-md)}
  .pay-box .pay-title{font-weight:700;color:var(--blue-ink);margin-bottom:12px;font-size:15px}
  .pay-box .bank-row{display:flex;justify-content:space-between;gap:12px;padding:6px 0;font-size:14.5px;color:var(--ink-soft)}
  .pay-box .bank-row .val{font-weight:700;color:var(--blue-ink)}
  .verif-note{background:var(--teal-bg);border:1px solid var(--teal-border);color:#0B6B62;padding:14px 18px;border-radius:var(--r-md);font-size:14.5px;font-weight:600;margin:4px 0 20px}

  .eta-note{background:linear-gradient(135deg,var(--blue-bg),#F1EEFF);border:1px solid var(--blue-border);color:var(--blue-ink);padding:16px 18px;border-radius:var(--r-md);font-size:14.5px;font-weight:500;margin:4px 0 20px}
  .eta-note .eta-sub{display:block;font-size:12.5px;color:#3455a8;font-weight:500;margin-top:6px}
  .eta-note.pending{background:var(--panel-alt);border:1px solid var(--border);color:var(--ink-soft)}
  .eta-note.claim{background:linear-gradient(135deg,var(--purple-bg),#FDEEFF);border-color:var(--purple-border);color:var(--purple-ink)}
  .countdown-badge{margin-top:12px;display:inline-flex;align-items:center;gap:7px;font-weight:700;background:rgba(255,255,255,.7);padding:8px 15px;border-radius:999px;font-size:13.5px;color:var(--blue-ink);border:1px solid var(--blue-border)}

  .detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px 20px}
  @media(max-width:480px){.detail-grid{grid-template-columns:1fr;gap:14px}}
  .detail-value{color:var(--ink);font-weight:600;font-size:15px}

  footer.foot{max-width:720px;margin:44px auto 60px;text-align:center;color:var(--ink-faint);font-size:13px;padding:0 20px}

  .promo-row{display:flex;gap:10px}
  .promo-row input{flex:1;text-transform:uppercase}
  .promo-row input::placeholder{text-transform:none}
  .promo-msg{font-size:13px;font-weight:600;margin-top:8px}
  .promo-msg.ok{color:var(--teal)}.promo-msg.err{color:#9C2A1D}
  .repeat-note{background:var(--teal-bg);border:1px solid var(--teal-border);color:#0B6B62;padding:14px 18px;border-radius:var(--r-md);font-size:14px;font-weight:500;margin:0 0 18px}
  .file-picked{font-size:12.5px;color:var(--teal);font-weight:600;margin-top:6px;word-break:break-all}

  .claim-card{border-left:3px solid var(--purple-border)}
  .claim-title{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .claim-badge{font-size:11.5px;font-weight:700;padding:4px 10px;border-radius:999px;text-transform:uppercase}
  .claim-badge.menunggu{background:var(--panel-alt);color:var(--ink-soft)}
  .claim-badge.dikerjakan{background:var(--purple-bg);color:var(--purple-ink)}
  .claim-badge.selesai{background:var(--teal-bg);color:#0B6B62}
  .claim-badge.ditolak{background:var(--coral-bg);color:#9C2A1D}

  .rules-box{background:#FFF7E6;border:1px solid #FFE0A3;border-radius:var(--r-md);padding:16px 20px;margin-bottom:18px}
  .rules-box .rules-title{font-weight:700;color:#8A5A00;margin-bottom:10px;font-size:14.5px}
  .rules-box ul{margin:0;padding-left:20px;color:#6B4A00;font-size:13.5px;line-height:1.7}
  .rules-box li{margin-bottom:2px}
  .rules-box .quota-line{display:flex;justify-content:space-between;font-weight:700;color:#8A5A00;margin-top:12px;padding-top:12px;border-top:1px dashed #FFE0A3}
</style>
</head>
<body>
<div class="top-stripe"></div>
<div id="app"><div id="content">Memuat aplikasi...</div></div>

<script>
(function(){
  "use strict";

  var CONFIG = {
    webAppUrl: "https://script.google.com/macros/s/AKfycbyLudpiOVp4qlKIQOQPI4HDH94xNYUmfgca7uCBHGrrHVrX-fVaRKqHvKqtu3x6CjNKJg/exec",
    businessName: "Order Animasi Microstock",
    currency: "Rp",
    rates: {
      packages: [
        { qty: 10, price: 75000, label: "Starter" },
        { qty: 20, price: 120000, label: "Standar" },
        { qty: 30, price: 150000, label: "Maksimal" }
      ],
      overflowPricePerVideo: 5000
    },
    production: { videosPerDay: 20, workWindowStartHour: 19, workWindowEndHour: 0, setupBufferHours: 0.5 },
    warranty: { enabled: true, windowDays: 14, maxPercentOfOrder: 20, maxClaimsPerOrder: 10, minClaims: 1 },
    timezoneOffsetHours: 7,
    maxProofSizeBytes: 4 * 1024 * 1024,
    payment: { bankName: "BCA", accountNumber: "5410769257", accountName: "Hersani Ardia Firmansyah" }
  };

  var STEP_ORDER = ["Brief Diterima","Pembayaran","Verifikasi","Order Dikerjakan","Selesai"];
  var PLATFORMS = ["Adobe Stock","Shutterstock"];

  var state = {
    tab: "order",
    orderForm: freshOrderForm(),
    calc: freshCalc(),
    statusLookupId: "",
    statusResult: null,
    statusError: "",
    statusLoading: false,
    statusRequestId: 0,
    statusProofError: "",
    statusUploading: false,
    orderMsg: null,
    warranty: freshWarranty(),
    warrantyElig: null
  };

  function uid(){ return "PRJ-" + Date.now().toString(36).toUpperCase().slice(-4) + Math.random().toString(36).toUpperCase().slice(2,6); }
  function escapeHtml(s){ return s==null?"":String(s).replace(/[&<>"']/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }
  function fmtMoney(n){
    var v = Math.round(Number(n)||0);
    if (isNaN(v)) return CONFIG.currency + " 0";
    return CONFIG.currency + " " + v.toLocaleString("id-ID");
  }

  function freshOrderForm(){ return { clientName:"",clientPhone:"",platforms:[],qty:10,isCustom:false,_pendingId:null,_submitting:false,promoCode:"",promo:null,promoMsg:null,promoLoading:false }; }
  function freshWarranty(){ return { id:"",open:false,rejectedFile:"",reason:"",file:null,submitting:false,error:"",done:null,elig:null }; }
  function freshCalc(){ return { qty:10,isCustom:false,platforms:[],_fetched:false,_loading:false,queuedHoursAhead:0 }; }

  function customMinQty(){ var p=CONFIG.rates.packages; return p[p.length-1].qty + 1; }

  function computePrice(qty){
    var q = Math.max(Math.round(Number(qty)||0),0);
    var pkgs = CONFIG.rates.packages;
    var maxQ = pkgs[pkgs.length-1].qty;
    if(q > maxQ){
      var total = q * CONFIG.rates.overflowPricePerVideo;
      return { total:total, isCustom:true, items:[{label:q+" video × "+fmtMoney(CONFIG.rates.overflowPricePerVideo),value:total}] };
    }
    var m = pkgs.filter(function(p){return p.qty===q;})[0] || pkgs.filter(function(p){return q<=p.qty;})[0] || pkgs[pkgs.length-1];
    return { total:m.price, isCustom:false, items:[{label:"Paket "+m.label+" ("+m.qty+" video)",value:m.price}] };
  }

  function workWindowHoursSim(){
    var p = CONFIG.production;
    return p.workWindowEndHour > p.workWindowStartHour ? (p.workWindowEndHour - p.workWindowStartHour) : ((24 - p.workWindowStartHour) + p.workWindowEndHour);
  }
  function hoursPerVideoSim(){ return workWindowHoursSim() / Math.max(CONFIG.production.videosPerDay,1); }
  function simulateEtaHours(qty, ahead){
    var p = CONFIG.production;
    return p.setupBufferHours + Math.max(Number(ahead)||0,0) + Math.max(Number(qty)||0,1) * hoursPerVideoSim();
  }
  function simulateTargetDate(base, hours){
    var p = CONFIG.production, off = CONFIG.timezoneOffsetHours * 3600000;
    var cur = new Date(base.getTime() + off), rem = hours * 60, guard = 0;
    while(rem > 1e-6 && guard < 100000){
      guard++;
      var h = cur.getUTCHours(), m = cur.getUTCMinutes();
      var inW = p.workWindowEndHour > p.workWindowStartHour ? (h >= p.workWindowStartHour && h < p.workWindowEndHour) : (h >= p.workWindowStartHour || h < p.workWindowEndHour);
      if(inW){
        var e = p.workWindowEndHour > p.workWindowStartHour ? (p.workWindowEndHour - h)*60 - m : ((24 - h) + p.workWindowEndHour)*60 - m;
        var c = Math.min(rem, e);
        cur = new Date(cur.getTime() + c*60000); rem -= c;
      } else {
        var s = h < p.workWindowStartHour ? (p.workWindowStartHour - h)*60 - m : ((24 - h) + p.workWindowStartHour)*60 - m;
        cur = new Date(cur.getTime() + s*60000);
      }
    }
    return new Date(cur.getTime() - off);
  }
  function formatTargetDate(d){
    var ds = d.toLocaleDateString('id-ID',{timeZone:'Asia/Jakarta',weekday:'long',day:'numeric',month:'long',year:'numeric'});
    var ts = d.toLocaleTimeString('id-ID',{timeZone:'Asia/Jakarta',hour:'2-digit',minute:'2-digit',hour12:false}).replace('.',':');
    return ds + ' pukul ' + ts + ' WIB';
  }

  function renderEtaSimulation(qty, ahead){
    var h = simulateEtaHours(qty, ahead);
    var t = simulateTargetDate(new Date(), h);
    var str = formatTargetDate(t);
    var note = (ahead && ahead > 0) ? ('Termasuk antrean ~'+Number(ahead).toLocaleString("id-ID",{maximumFractionDigits:1})+' jam dari pekerjaan lebih dulu.') : "";
    return '<div class="eta-note"><div>🎬 Jika pembayaran dikonfirmasi sekarang, target sekitar <strong>'+escapeHtml(str)+'</strong>.</div>'+(note?'<span class="eta-sub">'+escapeHtml(note)+'</span>':'')+'<span class="eta-sub">Tanggal final dihitung saat admin mengonfirmasi pembayaran.</span></div>';
  }
  function renderEtaLocked(iso, ahead, intro, cls, unit){
    if(!iso) return '<div class="eta-note pending">⏳ Tanggal target muncul setelah admin mengonfirmasi.</div>';
    var t = new Date(iso), str = formatTargetDate(t), note = "";
    if(ahead && ahead > 0){
      note = unit === "jam" ? "Beban sebelum pesanan ini: "+Number(ahead).toLocaleString("id-ID",{maximumFractionDigits:1})+" jam."
                           : "Termasuk antrean "+ahead+" video dari pesanan lain.";
    }
    return '<div class="eta-note '+(cls||'')+'"><div>🎬 '+intro+' Ditargetkan <strong>'+escapeHtml(str)+'</strong>.</div>'+(note?'<span class="eta-sub">'+escapeHtml(note)+'</span>':'')+'<div class="countdown-badge">⏳ <span class="countdown" data-target="'+t.toISOString()+'">menghitung...</span></div></div>';
  }
  function tickCountdowns(){
    document.querySelectorAll('.countdown[data-target]').forEach(function(el){
      var t = new Date(el.getAttribute('data-target')).getTime();
      var diff = t - Date.now();
      if(diff <= 0){ el.textContent = "Seharusnya sudah selesai — hubungi admin."; return; }
      var d=Math.floor(diff/86400000); diff-=d*86400000;
      var h=Math.floor(diff/3600000); diff-=h*3600000;
      var m=Math.floor(diff/60000); diff-=m*60000;
      var s=Math.floor(diff/1000);
      var p=function(n){return (n<10?"0":"")+n;};
      el.textContent = (d>0?d+" hari ":"")+p(h)+" jam "+p(m)+" menit "+p(s)+" detik lagi";
    });
  }
  function restartTicker(){
    if(window.__etaTicker){ clearInterval(window.__etaTicker); window.__etaTicker=null; }
    if(document.querySelector('.countdown[data-target]')){ tickCountdowns(); window.__etaTicker = setInterval(tickCountdowns,1000); }
  }

  function fetchJson(url, options, policy){
    options = options || {}; policy = policy || {};
    var maxA = Math.max(1, Number(policy.maxAttempts)||1);
    var timeoutMs = Math.max(1000, Number(policy.timeoutMs)||10000);
    function once(){
      var ctrl = typeof AbortController!=="undefined" ? new AbortController() : null;
      var opt = Object.assign({}, options);
      if(ctrl) opt.signal = ctrl.signal;
      var timer;
      var req = fetch(url, opt).then(function(res){
        return res.text().then(function(body){
          if(!res.ok){ var e = new Error("http_"+res.status); e.status = res.status; throw e; }
          try { return JSON.parse(body); }
          catch(pe){ var e = new Error("bad_response"); e.retryable = true; throw e; }
        });
      });
      var t = new Promise(function(_,rej){
        timer = setTimeout(function(){ if(ctrl) ctrl.abort(); var e = new Error("timeout"); e.isTimeout = true; rej(e); }, timeoutMs);
      });
      return Promise.race([req,t]).then(function(d){ clearTimeout(timer); return d; }, function(e){ clearTimeout(timer); throw e; });
    }
    function retryable(e){ return !e.status || e.status===429 || e.status>=500 || e.retryable || e.isTimeout; }
    function run(attempt){
      return once().catch(function(e){
        if(attempt >= maxA || !retryable(e)) throw e;
        var d = Math.min(1800, 500*Math.pow(2,attempt-1)) + Math.floor(Math.random()*250);
        return new Promise(function(r){ setTimeout(r,d); }).then(function(){ return run(attempt+1); });
      });
    }
    return run(1);
  }

  function apiGet(q){ q._t = Date.now(); var s = Object.keys(q).map(function(k){return encodeURIComponent(k)+"="+encodeURIComponent(q[k]);}).join("&"); return fetchJson(CONFIG.webAppUrl+"?"+s, {}, {maxAttempts:2,timeoutMs:15000}); }
  function readFileB64(f){
    return new Promise(function(res,rej){
      var r = new FileReader();
      r.onload = function(){ var s = r.result||""; var c = s.indexOf(","); res(c>-1?s.slice(c+1):s); };
      r.onerror = function(){ rej(new Error("read_failed")); };
      r.readAsDataURL(f);
    });
  }

  function submitWarranty(){
    var w = state.warranty;
    var inp = document.getElementById("warranty-file");
    var file = (inp && inp.files && inp.files[0]) || w.file;
    w.id = (w.id||"").trim().toUpperCase();
    w.rejectedFile = (w.rejectedFile||"").trim();
    w.reason = (w.reason||"").trim();
    if(!w.id || !state.statusResult || String(state.statusResult.id).toUpperCase() !== w.id){ w.error = "Lacak pesanan dulu."; render(); return; }
    if(!w.rejectedFile){ w.error = "Nama file wajib diisi."; render(); return; }
    if(!w.reason){ w.error = "Alasan penolakan wajib diisi."; render(); return; }
    if(!file){ w.error = "Unggah screenshot penolakan."; render(); return; }
    if(file.size > CONFIG.maxProofSizeBytes){ w.file=file; w.error = "Ukuran screenshot >4MB."; render(); return; }
    w.file=file; w.error=""; w.submitting=true; render();
    readFileB64(file).then(function(b64){
      return apiPost({action:"warranty_claim",id:w.id,rejectedFile:w.rejectedFile,reason:w.reason,
        proofFileName:file.name,mimeType:file.type||"image/jpeg",fileData:b64});
    }).then(function(data){
      w.submitting = false;
      if(data && data.success){
        w.done = data.claim || {fileName:w.rejectedFile,status:"Menunggu",submittedAt:new Date().toISOString()};
        w.file = null;
        if(!state.statusResult.claims) state.statusResult.claims = [];
        state.statusResult.claims.unshift({fileName:w.done.fileName,jumlahFile:1,status:w.done.status||"Menunggu",estimasiSelesai:null,submittedAt:w.done.submittedAt||new Date().toISOString()});
      } else {
        w.error = (data && (data.message||data.error)) || "Klaim gagal.";
      }
      render(); window.scrollTo(0,0);
    }).catch(function(){
      w.submitting = false;
      w.error = "Koneksi terputus. Lacak ulang sebelum coba lagi (hindari klaim dobel).";
      render();
    });
  }

  function attachHandlers(){
    var c = document.getElementById("content");
    c.querySelectorAll("[data-tab]").forEach(function(b){ b.addEventListener("click", function(){
      state.tab = b.getAttribute("data-tab"); state.statusError=""; state.orderMsg=null; render();
      if(state.tab === "calc") fetchQueue();
    }); });
    var bindInp = function(id, fn){ var e = document.getElementById(id); if(e) e.addEventListener("input", function(){ fn(e.value); }); };
    var bindNum = function(id, fn){ var e = document.getElementById(id); if(e) e.addEventListener("change", function(){ fn(Number(e.value)||0); }); };
    var clickAc = function(act, fn){ c.querySelectorAll('[data-action="'+act+'"]').forEach(function(el){ el.addEventListener("click", function(){ fn(el); }); }); };

    bindInp("f-clientName", function(v){ state.orderForm.clientName = v; });
    bindInp("f-clientPhone", function(v){ state.orderForm.clientPhone = v; });
    clickAc("toggle-platform", function(el){ var v = el.getAttribute("data-val"), i = state.orderForm.platforms.indexOf(v); if(i>-1) state.orderForm.platforms.splice(i,1); else state.orderForm.platforms.push(v); render(); });
    clickAc("pick-pkg", function(el){
      var v = el.getAttribute("data-qty"), f = state.orderForm;
      if(v === "custom"){ f.isCustom=true; f.qty=Math.max(50,customMinQty()); } else { f.isCustom=false; f.qty=Number(v); }
      render();
    });
    bindNum("f-qty-custom", function(v){ state.orderForm.qty = Math.max(Math.round(v),customMinQty()); render(); });
    clickAc("pick-pkg-calc", function(el){
      var v = el.getAttribute("data-qty"), cs = state.calc;
      if(v === "custom"){ cs.isCustom=true; cs.qty=Math.max(50,customMinQty()); } else { cs.isCustom=false; cs.qty=Number(v); }
      render();
    });
    bindNum("c-qty-custom", function(v){ state.calc.qty = Math.max(Math.round(v),customMinQty()); render(); });

    var promoEl = document.getElementById("f-promo");
    if(promoEl) promoEl.addEventListener("input", function(){
      var f = state.orderForm; f.promoCode = promoEl.value;
      if(f.promo || f.promoMsg){
        f.promo=null; f.promoMsg=null; render();
        var el = document.getElementById("f-promo");
        if(el){ el.focus(); var n = el.value.length; try{ el.setSelectionRange(n,n); }catch(e){} }
      }
    });
    clickAc("apply-promo", function(){
      var f = state.orderForm, code = (f.promoCode||"").trim().toUpperCase();
      if(!code){ f.promo=null; f.promoMsg="Isi kode promo dulu."; render(); return; }
      f.promoLoading=true; f.promoMsg=null; render();
      apiGet({action:"promo",code:code,qty:f.qty}).then(function(d){
        f.promoLoading=false;
        if(d && d.valid){ f.promo={code:d.code,discount:d.discount}; f.promoCode=d.code; f.promoMsg=d.message; }
        else { f.promo=null; f.promoMsg=(d&&d.message)||"Kode tidak valid."; }
        render();
      }).catch(function(){ f.promoLoading=false; f.promo=null; f.promoMsg="Gagal cek promo."; render(); });
    });

    clickAc("submit-order", function(){
      var f = state.orderForm;
      if(!f.clientName.trim() || !f.clientPhone.trim()){ state.orderMsg={error:"Lengkapi nama & WhatsApp."}; render(); return; }
      if(!f.platforms.length){ state.orderMsg={error:"Pilih minimal 1 platform."}; render(); return; }
      if(f.isCustom && (!f.qty || f.qty < customMinQty())){ state.orderMsg={error:"Minimal "+customMinQty()+" video."}; render(); return; }
      if(!f._pendingId) f._pendingId = uid();
      var id = f._pendingId;
      var price = computePrice(f.qty);
      f._submitting = true; render();
      apiPost({action:"create",id:id,clientName:f.clientName.trim(),clientPhone:f.clientPhone.trim(),platforms:f.platforms.slice(),qty:f.qty,total:price.total,promoCode:(f.promoCode||"").trim()})
        .then(function(d){
          f._submitting = false;
          if(d && d.success){
            var bt = d.project && typeof d.project.total === "number" ? d.project.total : price.total;
            var proj = {id:id,clientName:f.clientName,platforms:f.platforms.slice(),qty:f.qty,price:{total:bt},paid:false,googleDriveLink:d.project?d.project.googleDriveLink:"",isRepeat:!!(d.project&&d.project.isRepeat),discount:(d.project&&d.project.discount)||0,promoCode:(d.project&&d.project.promoCode)||""};
            state.orderMsg = {newId:id,project:proj,phase:"awaiting_payment",proofError:"",uploading:false};
            f._pendingId = null;
            render(); window.scrollTo(0,0);
          } else {
            state.orderMsg = {error:"Gagal: "+((d&&(d.message||d.error))||"tidak diketahui")};
            render();
          }
        }).catch(function(){ f._submitting=false; state.orderMsg={error:"Koneksi gagal. Coba lagi."}; render(); });
    });
    clickAc("submit-proof", function(){
      var inp = document.getElementById("proof-file-input");
      var file = inp && inp.files && inp.files[0];
      if(!file){ state.orderMsg.proofError="Pilih file bukti."; render(); return; }
      if(file.size > CONFIG.maxProofSizeBytes){ state.orderMsg.proofError="File >4MB."; render(); return; }
      state.orderMsg.proofError=""; state.orderMsg.uploading=true; render();
      var proj = state.orderMsg.project;
      uploadProof(proj.id, file).then(function(d){
        state.orderMsg.uploading = false;
        if(d && d.success){ proj.status="Verifikasi"; state.orderMsg.phase="proof_sent"; }
        else { state.orderMsg.proofError = "Gagal: "+((d&&d.error)||"?"); }
        render(); window.scrollTo(0,0);
      }).catch(function(){ state.orderMsg.uploading=false; state.orderMsg.proofError="Koneksi gagal."; render(); });
    });
    clickAc("order-new", function(){ state.orderForm = freshOrderForm(); state.orderMsg = null; render(); });
    clickAc("copy-id", function(el){ if(navigator.clipboard) navigator.clipboard.writeText(el.getAttribute("data-id")).catch(function(){}); var o = el.innerText; el.innerText = "Tersalin!"; setTimeout(function(){ el.innerText = o; },1800); });
    clickAc("goto-status", function(el){ state.statusLookupId = el.getAttribute("data-id"); state.tab = "status"; render(); lookupStatus(); });
    bindInp("status-id-input", function(v){ state.statusLookupId = v.toUpperCase(); });
    clickAc("lookup-status", lookupStatus);
    clickAc("submit-proof-status", function(el){
      var id = el.getAttribute("data-id");
      var inp = document.getElementById("status-proof-file");
      var file = inp && inp.files && inp.files[0];
      if(!file){ state.statusProofError="Pilih file."; render(); return; }
      if(file.size > CONFIG.maxProofSizeBytes){ state.statusProofError="File >4MB."; render(); return; }
      state.statusProofError=""; state.statusUploading=true; render();
      uploadProof(id, file).then(function(d){
        state.statusUploading=false;
        if(d && d.success){ state.statusResult.status="Verifikasi"; }
        else state.statusProofError = "Gagal: "+((d&&d.error)||"?");
        render();
      }).catch(function(){ state.statusUploading=false; state.statusProofError="Koneksi gagal."; render(); });
    });
    clickAc("toggle-plat-calc", function(el){ var v = el.getAttribute("data-val"), i = state.calc.platforms.indexOf(v); if(i>-1) state.calc.platforms.splice(i,1); else state.calc.platforms.push(v); render(); });
    clickAc("use-estimate", function(){ state.orderForm=freshOrderForm(); state.orderForm.qty=state.calc.qty; state.orderForm.isCustom=state.calc.isCustom; state.orderForm.platforms=state.calc.platforms.slice(); state.tab="order"; render(); window.scrollTo(0,0); });

    bindInp("w-file-name", function(v){ state.warranty.rejectedFile = v; });
    bindInp("w-reason", function(v){ state.warranty.reason = v; });
    var wf = document.getElementById("warranty-file");
    if(wf) wf.addEventListener("change", function(){ state.warranty.file = (wf.files&&wf.files[0])||null; });
    clickAc("submit-warranty", submitWarranty);
    clickAc("toggle-claim", function(){
      var p = state.statusResult;
      if(!p) return;
      var opening = !state.warranty.open;
      if(opening && state.warranty.id !== p.id){
        state.warranty = freshWarranty();
        state.warranty.id = p.id;
        state.warranty.elig = p.warranty;
      }
      state.warranty.open = opening;
      render();
      if(opening){
        var card = document.getElementById("claim-form-card");
        if(card) card.scrollIntoView({behavior:"smooth",block:"start"});
      }
    });
    clickAc("claim-another", function(){
      var id = state.statusResult && state.statusResult.id;
      var elig = state.warranty.elig;
      state.warranty = freshWarranty();
      state.warranty.id = id || "";
      state.warranty.elig = elig;
      state.warranty.open = true;
      render();
      var card = document.getElementById("claim-form-card");
      if(card) card.scrollIntoView({behavior:"smooth",block:"start"});
    });
    clickAc("close-claim", function(){ state.warranty.open = false; render(); });
  }

  function lookupStatus(){
    var el = document.getElementById("status-id-input");
    var id = (el ? el.value : state.statusLookupId).trim().toUpperCase();
    state.statusLookupId = id;
    var rid = ++state.statusRequestId;
    if(!id){ state.statusLoading=false; state.statusError="Masukkan kode pesanan."; state.statusResult=null; render(); return; }
    var same = state.statusResult && String(state.statusResult.id).toUpperCase() === id;
    state.statusLoading = true;
    state.statusError = "Memuat status...";
    if(!same) state.statusResult = null;
    if(state.warranty.id !== id){
      state.warranty = freshWarranty();
      state.warranty.id = id;
    }
    state.statusProofError = "";
    render();
    fetchJson(CONFIG.webAppUrl + "?id=" + encodeURIComponent(id) + "&_t=" + Date.now(), {}, {maxAttempts:2,timeoutMs:15000})
      .then(function(d){
        if(rid !== state.statusRequestId) return;
        state.statusLoading = false;
        if(d && d.error){ state.statusError="Kode tidak ditemukan. Periksa kembali."; state.statusResult=null; }
        else if(!d || !d.id){ state.statusError="Data tidak lengkap."; state.statusResult=null; }
        else { state.statusError=""; state.statusResult=d; state.warrantyElig=d.warranty; }
        render();
      })
      .catch(function(e){
        if(rid !== state.statusRequestId) return;
        state.statusLoading = false;
        state.statusError = e && e.isTimeout ? "Server lambat. Coba lagi." : "Gagal memuat. Coba lagi.";
        render();
      });
  }

  function fetchQueue(){
    if(state.calc._fetched || state.calc._loading) return;
    state.calc._loading = true;
    fetchJson(CONFIG.webAppUrl + "?action=queue", {}, {maxAttempts:2,timeoutMs:15000})
      .then(function(d){
        state.calc._loading = false; state.calc._fetched = true;
        state.calc.queuedHoursAhead = (d && typeof d.queuedHoursAhead === "number") ? d.queuedHoursAhead : 0;
        render();
      }).catch(function(){ state.calc._loading=false; state.calc._fetched=true; render(); });
  }

  function syncConfig(){
    if(!CONFIG.webAppUrl || CONFIG.webAppUrl.indexOf("ISI_URL") > -1) return;
    fetchJson(CONFIG.webAppUrl + "?action=config", {}, {maxAttempts:1,timeoutMs:6000})
      .then(function(d){
        if(d && d.production) CONFIG.production = d.production;
        if(d && d.rates) CONFIG.rates = d.rates;
        if(d && d.allowedPlatforms && d.allowedPlatforms.length) PLATFORMS = d.allowedPlatforms;
        if(d && d.warranty) CONFIG.warranty = d.warranty;
        render();
      }).catch(function(){});
  }

  render();
  syncConfig();
})();
</script>
</body>
</html>
