<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
    <title>Order Animasi Microstock — Pesanan & Tracking</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        /* CSS SUDAH DIBERSIHKAN DAN DIRAPIKAN */
        :root {
            --navy: #12162B; --navy-soft: #1D2240;
            --paper: #F4F5F9; --panel: #FFFFFF; --panel-alt: #EDEFF6;
            --border: #E1E4EE; --border-strong: #C7CCDE;
            --ink: #12131A; --ink-soft: #4A4D5E; --ink-faint: #868AA0;
            --accent: #FFA733; --accent-strong: #E88F12; --accent-ink: #17181F;
            --teal: #0E9C90; --teal-bg: #E7F7F5; --teal-border: #B7E7E1;
            --coral: #E8503D; --coral-bg: #FDEEEC; --coral-border: #F5C2BA;
            --blue-bg: #EAF0FF; --blue-border: #C7D6FA; --blue-ink: #1E3A8A;
            --purple-bg: #F1EEFF; --purple-border: #D9CFFB; --purple-ink: #4C2E9C;
            --radius-lg: 18px; --radius-md: 12px; --radius-sm: 8px;
            --font-display: 'Space Grotesk', sans-serif; --font-body: 'Inter', sans-serif;
            --shadow-card: 0 1px 2px rgba(18,22,43,0.04), 0 8px 24px -12px rgba(18,22,43,0.12);
        }
        * { box-sizing: border-box; }
        html, body { margin: 0; padding: 0; background: var(--paper); color: var(--ink); font-family: var(--font-body); font-size: 15.5px; line-height: 1.6; -webkit-font-smoothing: antialiased; }
        #app { max-width: 720px; margin: 0 auto; }
        main, header.top, nav.tabs, footer.foot { max-width: 720px; margin-left: auto; margin-right: auto; padding-left: 20px; padding-right: 20px; }
        a { color: inherit; }
        
        .top-stripe { height: 5px; background: repeating-linear-gradient(115deg, var(--accent) 0 16px, var(--navy) 16px 32px); }
        header.top { background: var(--navy); color: #fff; padding: 26px 20px 24px; margin-bottom: 0; border-radius: 0 0 22px 22px; box-shadow: 0 12px 28px -18px rgba(18,22,43,0.55); }
        header.top .top-row { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
        header.top .brand-name { font-family: var(--font-display); font-weight: 700; font-size: 24px; margin: 0 0 6px 0; color: #fff; }
        header.top .tagline { color: #A9AEC7; font-size: 14px; margin: 0; }
        
        nav.tabs { display: flex; gap: 8px; margin: 18px auto 28px; padding-top: 16px; overflow-x: auto; scrollbar-width: none; }
        nav.tabs::-webkit-scrollbar { display: none; }
        nav.tabs button { background: var(--panel); border: 1px solid var(--border); color: var(--ink-soft); font-family: var(--font-body); font-size: 14.5px; font-weight: 600; padding: 11px 18px; border-radius: 999px; cursor: pointer; transition: 0.15s ease; white-space: nowrap; }
        nav.tabs button:hover { border-color: var(--border-strong); color: var(--ink); }
        nav.tabs button.active { color: var(--accent-ink); border-color: var(--accent); background: var(--accent); }
        
        .card { background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 24px; margin-bottom: 18px; box-shadow: var(--shadow-card); }
        h2.panel-title { font-family: var(--font-display); font-size: 22px; font-weight: 700; margin: 0 0 6px 0; }
        p.panel-sub { color: var(--ink-soft); font-size: 14.5px; margin: 0 0 20px 0; }
        .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
        
        /* Forms & Buttons */
        label { display: block; font-size: 13px; color: var(--ink-soft); margin-bottom: 7px; font-weight: 600; }
        .field { margin-bottom: 18px; }
        input[type=text], input[type=number], input[type=tel], input[type=url], textarea, input[type=file] { width: 100%; background: var(--panel-alt); border: 1px solid var(--border); color: var(--ink); border-radius: var(--radius-sm); padding: 13px 14px; font-family: var(--font-body); font-size: 16px; min-height: 48px; transition: 0.15s ease; }
        input:focus { outline: none; background: var(--panel); border-color: var(--accent-strong); box-shadow: 0 0 0 4px rgba(255,167,51,0.18); }
        
        button.btn { font-family: var(--font-body); font-weight: 700; font-size: 15.5px; border-radius: var(--radius-sm); padding: 14px 24px; cursor: pointer; border: 1px solid transparent; transition: 0.15s ease; width: 100%; }
        button.btn-primary { background: var(--accent); color: var(--accent-ink); box-shadow: 0 4px 12px -4px rgba(232,143,18,0.5); }
        button.btn-primary:hover { background: var(--accent-strong); transform: translateY(-1px); }
        button.btn-ghost { background: transparent; color: var(--ink-soft); border-color: var(--border-strong); width: auto; }
        
        /* Utils */
        .chip-group { display: flex; flex-wrap: wrap; gap: 9px; }
        .chip { border: 1px solid var(--border); background: var(--panel); border-radius: 999px; padding: 10px 16px; font-size: 14px; cursor: pointer; color: var(--ink-soft); font-weight: 500; transition: 0.15s ease; }
        .chip.selected { background: var(--navy); color: #fff; border-color: var(--navy); }
        .msg { padding: 14px 18px; border-radius: var(--radius-sm); font-size: 14.5px; margin-bottom: 18px; font-weight: 500; }
        .msg-error { background: var(--coral-bg); border: 1px solid var(--coral-border); color: #9C2A1D; }
        
        @media (max-width: 640px) {
            .grid2 { grid-template-columns: 1fr; gap: 4px; }
            header.top { border-radius: 0 0 16px 16px; padding: 22px 18px 20px; }
            .card { padding: 20px; }
        }
    </style>
</head>
<body>
