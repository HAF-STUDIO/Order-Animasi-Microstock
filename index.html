<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
<title>Order Animasi Microstock</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--navy:#12162B;--paper:#F4F5F9;--panel:#fff;--alt:#EDEFF6;--bd:#E1E4EE;--bd2:#C7CCDE;--ink:#12131A;--soft:#4A4D5E;--faint:#868AA0;--acc:#FFA733;--acc2:#E88F12;--teal:#0E9C90;--tealbg:#E7F7F5;--tealbd:#B7E7E1;--coral:#E8503D;--coralbg:#FDEEEC;--coralbd:#F5C2BA;--blue:#EAF0FF;--bluebd:#C7D6FA;--blueink:#1E3A8A;--pur:#F1EEFF;--purbd:#D9CFFB;--purink:#4C2E9C;--amb:#FFF4D6;--ambink:#7A5A00;--fd:'Space Grotesk',sans-serif;--fb:'Inter',sans-serif}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--paper);color:var(--ink);font:15.5px/1.6 var(--fb);-webkit-font-smoothing:antialiased}
.stripe{height:5px;background:repeating-linear-gradient(115deg,var(--acc) 0 16px,var(--navy) 16px 32px)}
#app{max-width:720px;margin:0 auto}
:focus-visible{outline:2px solid var(--acc2);outline-offset:2px;border-radius:4px}
header{background:var(--navy);color:#fff;padding:26px 20px 24px;border-radius:0 0 22px 22px}
header .row{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;align-items:flex-start}
header h1{font:700 24px var(--fd);margin:0 0 6px}header p{margin:0;color:#A9AEC7;font-size:14px}
.pill{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;font-weight:600;color:#E7E9F5;border:1px solid rgba(255,255,255,.16);background:rgba(255,255,255,.06);border-radius:999px;padding:7px 14px}
.pill i{width:7px;height:7px;border-radius:50%;background:var(--acc)}
nav{display:flex;gap:8px;margin:18px 0 26px;padding:0 20px;overflow-x:auto;scrollbar-width:none}
nav button{background:var(--panel);border:1px solid var(--bd);color:var(--soft);font:600 14.5px var(--fb);padding:11px 18px;border-radius:999px;cursor:pointer;white-space:nowrap;flex:none}
nav button.on{background:var(--acc);border-color:var(--acc);color:#17181F}
main{padding:0 20px}
h2{font:700 22px var(--fd);margin:0 0 6px}.sub{color:var(--soft);font-size:14.5px;margin:0 0 20px}
.card{background:var(--panel);border:1px solid var(--bd);border-radius:18px;padding:24px;margin-bottom:18px;box-shadow:0 1px 2px rgba(18,22,43,.04),0 8px 24px -12px rgba(18,22,43,.12)}
.bt{font-weight:700;margin-bottom:12px;font-size:16px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:18px}@media(max-width:620px){.g2{grid-template-columns:1fr;gap:0}}
label{display:block;font-size:13px;color:var(--soft);margin-bottom:7px;font-weight:600}
.f{margin-bottom:18px}
input[type=text],input[type=number],input[type=tel],select,textarea{width:100%;background:var(--alt);border:1px solid var(--bd);color:var(--ink);border-radius:8px;padding:13px 14px;font:16px var(--fb);min-height:48px}
textarea{min-height:80px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:none;background:#fff;border-color:var(--acc2);box-shadow:0 0 0 4px rgba(255,167,51,.18)}
input[type=file]{width:100%;background:var(--alt);border:1px dashed var(--bd2);border-radius:8px;padding:12px;font-size:14px}
.note{font-size:12.5px;color:var(--faint);margin-top:6px}
.chips{display:flex;flex-wrap:wrap;gap:9px}
.chip{border:1px solid var(--bd);background:#fff;border-radius:999px;padding:10px 16px;font-size:14px;cursor:pointer;color:var(--soft);font-weight:500;min-height:40px;display:inline-flex;align-items:center;user-select:none}
.chip.sel{background:var(--navy);color:#fff;border-color:var(--navy);font-weight:600}
.btn{font:700 15.5px var(--fb);border-radius:8px;padding:14px 24px;cursor:pointer;border:1px solid transparent;display:inline-flex;align-items:center;justify-content:center;min-height:50px;text-decoration:none}
.btn:disabled{opacity:.6;cursor:not-allowed}
.b1{background:var(--acc);color:#17181F;width:100%}.b1:hover:not(:disabled){background:var(--acc2)}
.b2{background:transparent;color:var(--soft);border-color:var(--bd2)}.b2:hover{background:var(--alt)}
.sm{padding:10px 18px;font-size:14px;min-height:42px;width:auto}
.msg{padding:14px 18px;border-radius:8px;font-size:14.5px;margin-bottom:18px;font-weight:500}
.err{background:var(--coralbg);border:1px solid var(--coralbd);color:#9C2A1D}.info{background:var(--blue);border:1px solid var(--bluebd);color:var(--blueink)}.warn{background:var(--amb);border:1px solid #FFE0A3;color:var(--ambink)}
.ok{background:var(--tealbg);border:1px solid var(--tealbd);color:#0B6B62;padding:14px 18px;border-radius:12px;font-weight:600;font-size:14.5px;margin:4px 0 16px}
.est{background:var(--alt);border:1px solid var(--bd);border-left:3px solid var(--acc);border-radius:12px;padding:20px 22px}
.er{display:flex;justify-content:space-between;gap:12px;font-size:14.5px;padding:6px 0;color:var(--soft)}
.er.t{color:var(--ink);font-weight:700;font-size:18px;border-top:1px solid var(--bd2);margin-top:10px;padding-top:14px}
.er.d{color:var(--teal);font-weight:600}.er.p{color:var(--teal);font-weight:700}.er.r{color:var(--ambink);font-weight:700}
.idd{font:700 26px var(--fd);letter-spacing:.04em;background:var(--alt);border:2px dashed var(--bd2);color:var(--navy);padding:20px;border-radius:12px;text-align:center;margin:4px 0 20px;word-break:break-all}
.step{flex:1;text-align:center;position:relative;min-width:0}
.stp{display:flex;margin:30px 0 22px}
.step .dot{width:32px;height:32px;border-radius:50%;background:#fff;border:2px solid var(--bd2);display:flex;align-items:center;justify-content:center;margin:0 auto 10px;font-size:13px;font-weight:700;color:var(--faint);position:relative;z-index:2}
.step .ln{position:absolute;top:15px;left:-50%;width:100%;height:3px;background:var(--bd2);z-index:1}.step:first-child .ln{display:none}
.step.done .dot{background:var(--navy);border-color:var(--navy);color:#fff}.step.done .ln,.step.act .ln{background:var(--navy)}
.step.act .dot{background:var(--teal);border-color:var(--teal);color:#fff;box-shadow:0 0 0 5px var(--tealbg)}
.step .lb{font-size:11.5px;color:var(--faint);font-weight:500;line-height:1.3}.step.act .lb{color:var(--teal);font-weight:700}.step.done .lb{color:var(--ink);font-weight:600}
@media(max-width:480px){.step .lb{font-size:10px}.step .dot{width:26px;height:26px}.step .ln{top:12px}}
.cancel{background:var(--coralbg);border:1px solid var(--coralbd);color:#9C2A1D;padding:14px 18px;border-radius:12px;font-weight:600;margin:4px 0 20px}
.drive{margin-top:20px;padding:18px 20px;background:var(--tealbg);border:1px solid var(--tealbd);border-radius:12px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:14px}
.drive label{color:#0B6B62;margin:0}.bd{background:var(--teal);color:#fff;width:auto}
.pay{padding:20px 22px;background:var(--blue);border:1px solid var(--bluebd);border-radius:12px;margin-bottom:16px}
.pay .pt{font-weight:700;color:var(--blueink);margin-bottom:10px}
.br{display:flex;justify-content:space-between;gap:12px;padding:5px 0;font-size:14.5px;color:var(--soft)}.br b{color:var(--blueink)}
.eta{background:linear-gradient(135deg,var(--blue),#F1EEFF);border:1px solid var(--bluebd);color:var(--blueink);padding:16px 18px;border-radius:12px;font-size:14.5px;font-weight:500;margin:4px 0 18px}
.eta small{display:block;font-size:12.5px;color:#3455a8;margin-top:6px}.eta.pend{background:var(--alt);border-color:var(--bd);color:var(--soft)}.eta.cl{background:var(--pur);border-color:var(--purbd);color:var(--purink)}
.cd{margin-top:12px;display:inline-flex;gap:7px;font-weight:700;background:rgba(255,255,255,.7);padding:8px 15px;border-radius:999px;font-size:13.5px;border:1px solid var(--bluebd)}
.dg{display:grid;grid-template-columns:1fr 1fr;gap:18px 20px}@media(max-width:480px){.dg{grid-template-columns:1fr;gap:14px}}
.dv{font-weight:600}
.promo{display:flex;gap:10px}.promo input{flex:1;text-transform:uppercase}.promo input::placeholder{text-transform:none}
.pm{font-size:13px;font-weight:600;margin-top:8px}.pm.y{color:var(--teal)}.pm.n{color:#9C2A1D}
.rep{background:var(--tealbg);border:1px solid var(--tealbd);color:#0B6B62;padding:14px 18px;border-radius:12px;font-size:14px;margin-bottom:18px}
.picked{font-size:12.5px;color:var(--teal);font-weight:600;margin-top:6px;word-break:break-all}
.cc{border-left:3px solid var(--purbd)}.ct{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.cb{font-size:11.5px;font-weight:700;padding:4px 10px;border-radius:999px}
.cb.Menunggu{background:var(--alt);color:var(--soft)}.cb.Dikerjakan{background:var(--pur);color:var(--purink)}.cb.Selesai{background:var(--tealbg);color:#0B6B62}.cb.Ditolak{background:var(--coralbg);color:#9C2A1D}
.tag{font-size:12px;color:var(--faint);font-weight:500}
.rules{background:#FFF7E6;border:1px solid #FFE0A3;border-radius:12px;padding:6px 20px;margin-bottom:18px;color:#6B4A00;font-size:13.5px}
.rules summary{cursor:pointer;font-weight:700;color:#8A5A00;padding:10px 0}.rules ol{padding-left:20px;margin:0 0 12px;line-height:1.65}.rules li{margin-bottom:4px}
.quota{display:flex;justify-content:space-between;gap:12px;font-weight:700;color:#8A5A00;padding:10px 0;border-top:1px dashed #FFE0A3;font-size:13.5px}
.agree{display:flex;gap:10px;align-items:flex-start;margin-bottom:18px;font-size:14px;color:var(--soft)}.agree input{width:20px;height:20px;margin-top:2px;flex:none}
.pick{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}
footer{text-align:center;color:var(--faint);font-size:13px;margin:44px 0 60px;padding:0 20px}
</style>
</head>
<body>
<div class="stripe"></div>
<div id="app">Memuat aplikasi...</div>
<script>
(function(){
"use strict";
var C={
  url:"https://script.google.com/macros/s/AKfycbwZVWz87uMWL7_M6buAvugqiYItZB72R74LmXCU9n2SoGKI2vdRANDuGbidbwSbm8h_/exec",
  name:"Order Animasi Microstock",
  rates:{packages:[{qty:10,price:75000,label:"Starter"},{qty:20,price:120000,label:"Standar"},{qty:30,price:150000,label:"Maksimal"}],overflowPricePerVideo:5000},
  prod:{videosPerDay:20,workWindowStartHour:19,workWindowEndHour:0,setupBufferHours:0.5},
  warranty:{windowDays:14,maxPercentOfOrder:20,conceptPercent:50,massPercent:50,maxPending:3},
  dpPct:50,tz:7,maxProof:4*1024*1024,
  bank:{name:"BCA",no:"5410769257",holder:"Hersani Ardia Firmansyah"}
};
var STEPS=["Brief Diterima","Pembayaran","Verifikasi","Order Dikerjakan","Selesai"];
var PLATS=["Adobe Stock","Shutterstock"];
var TYPES=[
 {k:"Teknis",t:"Masalah teknis (blur, noise, artifacts, exposure)"},
 {k:"Properti",t:"Izin / properti (logo, tato, karya seni, wajah)"},
 {k:"Mirip",t:"Konten mirip (similar content)"},
 {k:"Nilai Komersial",t:"Kurang nilai komersial"}];
var CONCEPT={"Mirip":1,"Nilai Komersial":1};
var S={tab:"order",form:newForm(),calc:{qty:10,custom:false,plats:[],ahead:0,fetched:false,loading:false},
  lid:"",res:null,err:"",loading:false,rid:0,perr:"",upl:false,om:null,cl:newClaim()};

function newForm(){return{name:"",phone:"",plats:[],qty:10,custom:false,pid:null,busy:false,code:"",promo:null,pmsg:null,pload:false}}
function newClaim(){return{open:false,type:"Teknis",plat:"",file:"",reason:"",fobj:null,agree:false,busy:false,err:""}}
function uid(){var a="ABCDEFGHJKLMNPQRSTUVWXYZ23456789",s="PRJ-";var b=new Uint32Array(12);(window.crypto||window.msCrypto).getRandomValues(b);for(var i=0;i<12;i++)s+=a[b[i]%a.length];return s}
function e(s){return s==null?"":String(s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function rp(n){return "Rp "+Math.round(Number(n)||0).toLocaleString("id-ID")}
function minCustom(){var p=C.rates.packages;return p[p.length-1].qty+1}
function price(q){
  q=Math.max(Math.round(Number(q)||0),0);var p=C.rates.packages,mx=p[p.length-1].qty;
  if(q>mx){var t=q*C.rates.overflowPricePerVideo;return{total:t,items:[[q+" video × "+rp(C.rates.overflowPricePerVideo),t]]}}
  var m=p.filter(function(x){return x.qty===q})[0]||p.filter(function(x){return q<=x.qty})[0]||p[p.length-1];
  return{total:m.price,items:[["Paket "+m.label+" ("+m.qty+" video)",m.price]]}
}

/* ETA simulasi */
function hpv(){var p=C.prod,w=p.workWindowEndHour>p.workWindowStartHour?p.workWindowEndHour-p.workWindowStartHour:24-p.workWindowStartHour+p.workWindowEndHour;return w/Math.max(p.videosPerDay,1)}
function target(base,hrs){
  var p=C.prod,off=C.tz*3600000,cur=new Date(base.getTime()+off),rem=hrs*60,g=0;
  while(rem>1e-6&&g++<100000){
    var h=cur.getUTCHours(),m=cur.getUTCMinutes(),w=p.workWindowEndHour>p.workWindowStartHour?(h>=p.workWindowStartHour&&h<p.workWindowEndHour):(h>=p.workWindowStartHour||h<p.workWindowEndHour);
    if(w){var en=p.workWindowEndHour>p.workWindowStartHour?(p.workWindowEndHour-h)*60-m:(24-h+p.workWindowEndHour)*60-m,c=Math.min(rem,en);cur=new Date(cur.getTime()+c*60000);rem-=c}
    else{var st=h<p.workWindowStartHour?(p.workWindowStartHour-h)*60-m:(24-h+p.workWindowStartHour)*60-m;cur=new Date(cur.getTime()+st*60000)}
  }
  return new Date(cur.getTime()-off)
}
function fdate(d){
  var a=d.toLocaleDateString("id-ID",{timeZone:"Asia/Jakarta",weekday:"long",day:"numeric",month:"long",year:"numeric"});
  var b=d.toLocaleTimeString("id-ID",{timeZone:"Asia/Jakarta",hour:"2-digit",minute:"2-digit",hour12:false}).replace(".",":");
  return a+" pukul "+b+" WIB"
}
function etaSim(q,ahead){
  var d=target(new Date(),C.prod.setupBufferHours+(ahead||0)+q*hpv());
  return '<div class="eta">🎬 Jika DP dikonfirmasi sekarang, target sekitar <strong>'+e(fdate(d))+'</strong>.<small>Tanggal final dihitung saat admin mengonfirmasi pembayaran.</small></div>'
}
function etaLock(iso,intro,cls,note){
  if(!iso)return '<div class="eta pend">⏳ Tanggal target muncul setelah admin mengonfirmasi.</div>';
  var t=new Date(iso);
  return '<div class="eta '+(cls||"")+'"><div>🎬 '+intro+' Ditargetkan <strong>'+e(fdate(t))+'</strong>.</div>'+(note?'<small>'+e(note)+'</small>':"")+'<div class="cd">⏳ <span class="cdn" data-t="'+t.toISOString()+'">menghitung...</span></div></div>'
}
function tick(){
  document.querySelectorAll(".cdn[data-t]").forEach(function(el){
    var df=new Date(el.getAttribute("data-t")).getTime()-Date.now();
    if(df<=0){el.textContent="Seharusnya sudah selesai — hubungi admin.";return}
    var d=Math.floor(df/864e5);df-=d*864e5;var h=Math.floor(df/36e5);df-=h*36e5;var m=Math.floor(df/6e4);df-=m*6e4;var s=Math.floor(df/1e3);
    var p=function(n){return(n<10?"0":"")+n};
    el.textContent=(d>0?d+" hari ":"")+p(h)+" jam "+p(m)+" menit "+p(s)+" detik lagi"
  })
}
function ticker(){if(window.__tk){clearInterval(window.__tk);window.__tk=null}if(document.querySelector(".cdn[data-t]")){tick();window.__tk=setInterval(tick,1000)}}

/* jaringan */
function fj(url,opt,pol){
  opt=opt||{};pol=pol||{};var max=Math.max(1,pol.n||1),to=pol.t||10000;
  function once(){
    var ctl=typeof AbortController!=="undefined"?new AbortController():null,o=Object.assign({},opt);if(ctl)o.signal=ctl.signal;var tm;
    var rq=fetch(url,o).then(function(r){return r.text().then(function(b){
      if(!r.ok){var x=new Error("http");x.status=r.status;throw x}
      try{return JSON.parse(b)}catch(pe){var y=new Error("bad");y.retry=true;throw y}})});
    var tp=new Promise(function(_,rej){tm=setTimeout(function(){if(ctl)ctl.abort();var z=new Error("timeout");z.timeout=true;rej(z)},to)});
    return Promise.race([rq,tp]).then(function(d){clearTimeout(tm);return d},function(x){clearTimeout(tm);throw x})
  }
  function retry(x){return!x.status||x.status===429||x.status>=500||x.retry||x.timeout}
  function run(a){return once().catch(function(x){if(a>=max||!retry(x))throw x;return new Promise(function(r){setTimeout(r,Math.min(1800,500*Math.pow(2,a-1))+Math.random()*250)}).then(function(){return run(a+1)})})}
  return run(1)
}
function post(p){return fj(C.url,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(p)},{t:30000})}
function get(q){q._t=Date.now();return fj(C.url+"?"+Object.keys(q).map(function(k){return encodeURIComponent(k)+"="+encodeURIComponent(q[k])}).join("&"),{},{n:2,t:15000})}
function b64(f){return new Promise(function(res,rej){var r=new FileReader();r.onload=function(){var s=r.result||"",c=s.indexOf(",");res(c>-1?s.slice(c+1):s)};r.onerror=function(){rej(new Error("read"))};r.readAsDataURL(f)})}
function sendProof(id,f){return b64(f).then(function(d){return post({action:"upload_proof",id:id,fileName:f.name,mimeType:f.type||"image/jpeg",fileData:d})})}

/* komponen */
function chips(sel,act,list,multi){return '<div class="chips">'+list.map(function(x){var on=multi?sel.indexOf(x)>-1:sel===x;return '<span class="chip '+(on?"sel":"")+'" data-a="'+act+'" data-v="'+e(x)+'" role="button" tabindex="0">'+e(x)+'</span>'}).join("")+'</div>'}
function pkgChips(q,custom,tg){
  var h=C.rates.packages.map(function(p){return '<span class="chip '+(!custom&&q===p.qty?"sel":"")+'" data-a="pkg-'+tg+'" data-v="'+p.qty+'" role="button" tabindex="0">'+e(p.label)+' ('+p.qty+' video) — '+rp(p.price)+'</span>'}).join("");
  h+='<span class="chip '+(custom?"sel":"")+'" data-a="pkg-'+tg+'" data-v="custom" role="button" tabindex="0">Pesanan Besar (&gt;'+(minCustom()-1)+' video)</span>';
  return '<div class="chips">'+h+'</div>'
}
function customQ(q,id){return '<div class="f"><label>Jumlah video (minimal '+minCustom()+')</label><input type="number" id="'+id+'" min="'+minCustom()+'" value="'+q+'"><div class="note">'+rp(C.rates.overflowPricePerVideo)+'/video, dikerjakan bertahap.</div></div>'}
function dpInfo(total,paid){
  var dp=Math.ceil(total*C.dpPct/100);
  if(paid>=total&&total>0)return"";
  if(paid>=dp)return '<div class="ok">DP sudah diterima dan pengerjaan berjalan. Lunasi sisa tagihan sebelum file hasil dikirim.</div>';
  return '<div class="note" style="margin:0 0 12px;color:var(--blueink)">Pengerjaan dimulai setelah DP minimal <b>'+rp(dp)+'</b> ('+C.dpPct+'%) terverifikasi. Sisa dibayar sebelum file dikirim.</div>'
}
function payBox(total,paid,disc,code){
  var rem=Math.max(total-paid,0);
  return '<div class="pay"><div class="pt">Instruksi Pembayaran</div>'+
   '<div class="br"><span>Bank</span><b>'+e(C.bank.name)+'</b></div><div class="br"><span>No. Rekening</span><b>'+e(C.bank.no)+'</b></div><div class="br"><span>Atas Nama</span><b>'+e(C.bank.holder)+'</b></div>'+
   (disc?'<div class="br"><span>Diskon'+(code?" ("+e(code)+")":"")+'</span><b>- '+rp(disc)+'</b></div>':"")+
   '<div class="br"><span>Total tagihan</span><b>'+rp(total)+'</b></div>'+
   (paid>0?'<div class="br"><span>Sudah dibayar</span><b>'+rp(paid)+'</b></div>':"")+
   '<div class="br"><span>Sisa</span><b>'+rp(rem)+'</b></div></div>'+dpInfo(total,paid)
}
function proofBox(id,act,inputId,upl,perr,label){
  return '<div class="f"><label>Foto Bukti Transfer</label><input type="file" id="'+inputId+'" accept="image/*" '+(upl?"disabled":"")+'><div class="note">JPG/PNG, maks 4MB. Sebutkan nominal yang Anda transfer di bukti.</div></div>'+
   (perr?'<div class="msg err">'+e(perr)+'</div>':"")+
   '<button class="btn b1" data-a="'+act+'" data-id="'+e(id)+'" '+(upl?"disabled":"")+'>'+(upl?"Mengunggah...":label)+'</button>'
}

/* render */
function render(){
  var h='<header><div class="row"><div><h1>'+e(C.name)+'</h1><p>Pemesanan &amp; pelacakan proyek</p></div><div class="pill"><i></i>Sistem Online</div></div></header>'+
   '<nav>'+[["order","Buat Pesanan"],["status","Lacak Status"],["calc","Estimasi Harga"]].map(function(t){return '<button data-a="tab" data-v="'+t[0]+'" class="'+(S.tab===t[0]?"on":"")+'">'+t[1]+'</button>'}).join("")+'</nav>'+
   '<main>'+(S.tab==="order"?tabOrder():S.tab==="status"?tabStatus():tabCalc())+'</main><footer>Data pesanan tersimpan privat.</footer>';
  document.getElementById("app").innerHTML=h;ticker()
}

function claimCards(list){
  if(!list||!list.length)return"";
  return list.map(function(c){
    var b="",cn=CONCEPT[c.claimType];
    if(c.status==="Menunggu")b='<div class="ok">Klaim sedang ditinjau admin.</div>';
    else if(c.status==="Dikerjakan")b=etaLock(c.estimasiSelesai,(cn?"Video pengganti untuk ":"Revisi file ")+e(c.fileName)+" sedang dikerjakan.","cl");
    else if(c.status==="Selesai")b='<div class="ok">'+(cn?"Video pengganti":"Revisi")+' untuk <b>'+e(c.fileName)+'</b> selesai. Cek folder hasil dan unggah hanya ke platform '+e(c.platform||"yang menolak")+'.</div>';
    else if(c.status==="Ditolak")b='<div class="cancel">Klaim untuk '+e(c.fileName)+' ditolak.'+(c.alasan?" Alasan: "+e(c.alasan)+".":"")+'</div>';
    return '<div class="card cc"><div class="bt ct">'+e(c.fileName)+' <span class="cb '+e(c.status)+'">'+e(c.status)+'</span> <span class="tag">'+e(c.claimType||"Teknis")+(c.platform?" · "+e(c.platform):"")+'</span></div>'+b+'</div>'
  }).join("")
}

/* aksi */
function lookup(){
  var el=document.getElementById("s-id"),id=(el?el.value:S.lid).trim().toUpperCase();S.lid=id;var rid=++S.rid;
  if(!id){S.loading=false;S.err="Masukkan kode pesanan.";S.res=null;render();return}
  var same=S.res&&String(S.res.id).toUpperCase()===id;S.loading=true;S.err="Memuat status...";if(!same)S.res=null;S.perr="";render();
  fj(C.url+"?id="+encodeURIComponent(id)+"&_t="+Date.now(),{},{n:2,t:15000}).then(function(d){
    if(rid!==S.rid)return;S.loading=false;
    if(d&&d.error){S.err="Kode tidak ditemukan. Periksa kembali.";S.res=null}
    else if(!d||!d.id){S.err="Data tidak lengkap.";S.res=null}
    else{S.err="";S.res=d;if(S.cl.id!==d.id)S.cl=newClaim();S.cl.id=d.id}
    render()
  }).catch(function(x){if(rid!==S.rid)return;S.loading=false;S.err=x&&x.timeout?"Server lambat. Coba lagi.":"Gagal memuat. Coba lagi.";render()})
}
function fetchQueue(){
  if(S.calc.fetched||S.calc.loading)return;S.calc.loading=true;
  fj(C.url+"?action=queue",{},{n:2,t:15000}).then(function(d){S.calc.loading=false;S.calc.fetched=true;S.calc.ahead=d&&typeof d.queuedHoursAhead==="number"?d.queuedHoursAhead:0;render()}).catch(function(){S.calc.loading=false;S.calc.fetched=true;render()})
}
function pickFile(id){var i=document.getElementById(id);return i&&i.files&&i.files[0]}
function sendClaim(){
  var c=S.cl,p=S.res,shot=pickFile("c-shot")||c.fobj;c.fobj=shot||null;
  if(!p){return}
  if(!c.plat){c.err="Pilih platform yang menolak.";render();return}
  if(!c.file.trim()){c.err="Pilih atau isi nama file.";render();return}
  if(!c.reason.trim()){c.err="Isi teks penolakan dari platform.";render();return}
  if(!shot){c.err="Unggah screenshot penolakan.";render();return}
  if(shot.size>C.maxProof){c.err="Ukuran screenshot lebih dari 4MB.";render();return}
  if(!c.agree){c.err="Centang persetujuan Syarat & Ketentuan.";render();return}
  c.err="";c.busy=true;render();
  b64(shot).then(function(d){return post({action:"warranty_claim",id:p.id,rejectedFile:c.file.trim(),reason:c.reason.trim(),claimType:c.type,platform:c.plat,agreed:true,proofFileName:shot.name,mimeType:shot.type||"image/jpeg",fileData:d})}).then(function(d){
    c.busy=false;
    if(d&&d.success){c.done=d.claim||{fileName:c.file};c.fobj=null;lookupKeep()}
    else{c.err=(d&&(d.message||d.error))||"Klaim gagal.";render()}
  }).catch(function(){c.busy=false;c.err="Koneksi terputus. Lacak ulang sebelum mencoba lagi agar klaim tidak dobel.";render()})
}
function lookupKeep(){
  var id=S.res.id;fj(C.url+"?id="+encodeURIComponent(id)+"&_t="+Date.now(),{},{n:2,t:15000}).then(function(d){if(d&&d.id)S.res=d;render();window.scrollTo(0,0)}).catch(function(){render()})
}
function doProof(id,file,target){
  if(!file){target.perr="Pilih file bukti.";render();return}
  if(file.size>C.maxProof){target.perr="File lebih dari 4MB.";render();return}
  target.perr="";target.upl=true;render();
  sendProof(id,file).then(function(d){
    target.upl=false;
    if(d&&d.success){if(target===S.om){S.om.phase="sent"}else{S.perr="";lookup();return}}
    else target.perr="Gagal: "+((d&&d.error)||"tidak diketahui");
    render();window.scrollTo(0,0)
  }).catch(function(){target.upl=false;target.perr="Koneksi gagal.";render()})
}
function submitOrder(){
  var f=S.form;
  if(!f.name.trim()||!f.phone.trim()){S.om={error:"Lengkapi nama & WhatsApp."};render();return}
  if(!f.plats.length){S.om={error:"Pilih minimal 1 platform."};render();return}
  if(f.custom&&(!f.qty||f.qty<minCustom())){S.om={error:"Minimal "+minCustom()+" video."};render();return}
  if(!f.pid)f.pid=uid();var id=f.pid,pr=price(f.qty);f.busy=true;render();
  post({action:"create",id:id,clientName:f.name.trim(),clientPhone:f.phone.trim(),platforms:f.plats.slice(),qty:f.qty,total:pr.total,promoCode:(f.code||"").trim()}).then(function(d){
    f.busy=false;
    if(d&&d.success){var q=d.project||{};S.om={id:id,phase:"pay",perr:"",upl:false,p:{total:typeof q.total==="number"?q.total:pr.total,discount:q.discount||0,promoCode:q.promoCode||"",isRepeat:!!q.isRepeat}};f.pid=null;render();window.scrollTo(0,0)}
    else{S.om={error:"Gagal: "+((d&&(d.message||d.error))||"tidak diketahui")};render()}
  }).catch(function(){f.busy=false;S.om={error:"Koneksi gagal. Coba lagi."};render()})
}
function applyPromo(){
  var f=S.form,code=(f.code||"").trim().toUpperCase();
  if(!code){f.promo=null;f.pmsg="Isi kode promo dulu.";render();return}
  f.pload=true;f.pmsg=null;render();
  get({action:"promo",code:code,qty:f.qty}).then(function(d){f.pload=false;if(d&&d.valid){f.promo={code:d.code,discount:d.discount};f.code=d.code;f.pmsg=d.message}else{f.promo=null;f.pmsg=(d&&d.message)||"Kode tidak valid."}render()}).catch(function(){f.pload=false;f.promo=null;f.pmsg="Gagal cek promo.";render()})
}
function pickPkg(o,v){if(v==="custom"){o.custom=true;o.qty=Math.max(50,minCustom())}else{o.custom=false;o.qty=Number(v)}}
function toggle(a,v){var i=a.indexOf(v);if(i>-1)a.splice(i,1);else a.push(v)}

document.addEventListener("click",function(ev){
  var t=ev.target.closest("[data-a]");if(!t)return;var a=t.getAttribute("data-a"),v=t.getAttribute("data-v"),id=t.getAttribute("data-id");
  switch(a){
    case"tab":S.tab=v;S.err="";S.om=null;render();if(v==="calc")fetchQueue();break;
    case"plat":toggle(S.form.plats,v);render();break;
    case"cplat":toggle(S.calc.plats,v);render();break;
    case"pkg-o":pickPkg(S.form,v);S.form.promo=null;S.form.pmsg=null;render();break;
    case"pkg-c":pickPkg(S.calc,v);render();break;
    case"promo":applyPromo();break;
    case"submit":submitOrder();break;
    case"proof-new":doProof(id,pickFile("proof-new-file"),S.om);break;
    case"proof-st":doProof(id,pickFile("proof-st-file"),S);break;
    case"newo":S.form=newForm();S.om=null;render();break;
    case"copy":if(navigator.clipboard)navigator.clipboard.writeText(id).catch(function(){});var o=t.innerText;t.innerText="Tersalin!";setTimeout(function(){t.innerText=o},1800);break;
    case"goto":S.lid=id;S.tab="status";render();lookup();break;
    case"lookup":lookup();break;
    case"use":var q=S.calc;S.form=newForm();S.form.qty=q.qty;S.form.custom=q.custom;S.form.plats=q.plats.slice();S.tab="order";render();window.scrollTo(0,0);break;
    case"claim-toggle":var op=!S.cl.open;if(op&&S.res){var keep=S.cl.id;S.cl=newClaim();S.cl.id=keep}S.cl.open=op;render();if(op){var cc=document.getElementById("claim-card");if(cc)cc.scrollIntoView({behavior:"smooth",block:"start"})}break;
    case"claim-more":var k=S.cl.id;S.cl=newClaim();S.cl.id=k;S.cl.open=true;render();break;
    case"claim-close":S.cl.open=false;render();break;
    case"claim-send":sendClaim();break;
  }
});
document.addEventListener("keydown",function(ev){if((ev.key==="Enter"||ev.key===" ")&&ev.target.classList&&ev.target.classList.contains("chip")){ev.preventDefault();ev.target.click()}});
document.addEventListener("input",function(ev){
  var el=ev.target,i=el.id,v=el.value;
  if(i==="f-name")S.form.name=v;else if(i==="f-phone")S.form.phone=v;
  else if(i==="s-id")S.lid=v.toUpperCase();
  else if(i==="c-reason")S.cl.reason=v;
  else if(i==="c-file"&&el.tagName==="INPUT")S.cl.file=v;
  else if(i==="f-promo"){var f=S.form;f.code=v;if(f.promo||f.pmsg){f.promo=null;f.pmsg=null;render();var n=document.getElementById("f-promo");if(n){n.focus();try{n.setSelectionRange(n.value.length,n.value.length)}catch(x){}}}}
});
document.addEventListener("change",function(ev){
  var el=ev.target,i=el.id,v=el.value;
  if(i==="f-qty"){S.form.qty=Math.max(Math.round(Number(v)||0),minCustom());S.form.promo=null;S.form.pmsg=null;render()}
  else if(i==="c-qty"){S.calc.qty=Math.max(Math.round(Number(v)||0),minCustom());render()}
  else if(i==="c-type"){S.cl.type=v;render()}
  else if(i==="c-plat")S.cl.plat=v;
  else if(i==="c-file")S.cl.file=v;
  else if(i==="c-shot")S.cl.fobj=(el.files&&el.files[0])||null;
  else if(i==="c-agree")S.cl.agree=el.checked;
});

render();
if(C.url.indexOf("ISI_URL")===-1)fj(C.url+"?action=config",{},{n:1,t:6000}).then(function(d){
  if(d&&d.production)C.prod=d.production;if(d&&d.rates)C.rates=d.rates;
  if(d&&d.allowedPlatforms&&d.allowedPlatforms.length)PLATS=d.allowedPlatforms;
  if(d&&d.warranty)C.warranty=d.warranty;if(d&&d.payment&&d.payment.dpMinPercent)C.dpPct=d.payment.dpMinPercent;
  render()
}).catch(function(){});
})();
</script>
</body>
</html>
